; melee_touch_thrown: 1 (the default) = with melee_touch on, a javelin, a throwing knife or a throwing axe in hand is swung like any weapon
;     (throwing potions are not): its blade through a monster's body presses the game's own attack at it - for a thrown weapon the game's
;     Throw at that monster, point blank, the ammunition spent as the game spends it (never the Direct hit route). The throw by gesture
;     ([hands] throw_by_grip / throw_gesture) stays as it is and does not fire together with the touch: with the grip throw on, the touch
;     counts only while the right grip is squeezed on the weapon; for 0.7 s after a throw is released the touch stands down; a touch
;     that pressed the attack drops the release of the same swing (one throw per swing). The blade's size per weapon is an estimate
;     (vr/blade_shape.h): tune it with [debug] melee_blade_* and melee_boxes. 0 = a thrown weapon does nothing by touch, as before. Live
melee_touch_thrown=1
; melee_touch_only: 1 (the default) = with melee_touch on, THE TRIGGER DOES NOT ATTACK - a part of hit by touch (a trigger that attacks lets you skip the swing and just pull it: a bug, the player said), this key is the way
;     back. In first person (F4) with the plugin's own controls ([openxr] direct_input), while hit by touch is swinging a weapon, the trigger's attack (action:attack / pad A / RT of the [direct] layout) is left
;     out of what it gives, so only the blade's touch attacks. That is every weapon the touch swings: melee weapons, bare hands and throwing weapons (javelins, throwing knives and axes: the touch or the throw gesture
;     throws them); a BOW and a CROSSBOW keep the trigger (shot, not swung). Spells and skills on the other buttons (B X Y RB, the skill wheel) are as they were, and every other output the trigger is bound to (a
;     skill button, a command) works as bound. Only the plugin's own controller press is withheld - nothing of the game is blocked or hooked. The trigger works as ever where hit by touch does not run (no
;     tracking, a menu or a panel up, another view, a throwing weapon with melee_touch_thrown=0, a throwing potion). With BodyWalk's own input ([openxr] direct_input=0) the trigger is BodyWalk's and this cannot
;     reach it. The log says what it decided ("melee touch only: ..."). 0 = the trigger attacks as it did before. Live
melee_touch_only=1
; melee_direct: 1 = EXPERIMENTAL, with melee_touch on. At an accepted touch the plugin calls the game's own basic attack on the
;     game's server itself (the way bearstonem/d2r-pcvr does) instead of pressing the attack button. Kept: the hit roll, the
;     damage, the weapon's wear. Skipped: the animation and sound, the game's attack-rate gate, the walk up to the monster (the
;     blade's contact is the reach), the 50-cell command check, the start checks (mana, ammunition present, town), the skill's
;     delay. Only against a monster the game calls hostile, with no wall between. Offline only: with no local game server
;     found, a signature missing or after a fault in the call, it falls back to the game's own key. 0 = the touch presses the
;     game's attack (as before). The log: "melee direct: ..." and "melee touch (direct): call->hit ms ...".
melee_direct=0
; melee_direct_min_ms: least time in ms between two direct hits; the touches inside it do nothing. 0 = no limit beyond "a
;     monster is hit once per stroke". (Only with melee_direct=1.)
melee_direct_min_ms=0


