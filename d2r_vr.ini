y=0
z=0
pitch=0
yaw=0
roll=0

[hud]
; the corner map: 0 in the picture, 1 out of it, into a texture of its own (labels over monsters stay)
map=1
; the game's interface out of the picture: 0 nothing, 1 the toolbar (the map stays), 2 all of it (labels, panels, text too)
hide=1
