; d2r_vr.ini - put next to d2rl-vrcam.dll (the mod's mods\D2R-VR\d2rloader\plugins). No d2rl-renderdistance.dll: [render] rings and model_radius are vrcam's own now.
; vrcam re-reads the whole file within half a second of a save (game running); a key said to be read at the start, or to need a restart, waits for one.
; NOT READ HERE (above any section): vrcam reads [render] background_full_speed, missing = 1. 1 = full frame rate while the game window is behind BodyWalk or the headset (the game sleeps 10 ms a frame there: ~60 fps)
background_full_speed=1
; (is read when the game starts.)

[camera]
; 1 = the FOV follows the FlatVR screen (its size and distance in BodyWalk), like an OpenXR game's view
fov_from_flatvr=1
; vertical FOV of the game camera when fov_from_flatvr=0
fov=64
; camera behind the eye point; below 0 = in front of the face, 45 = upstream 3dcam view
distance=0
; eye point above the ground under the hero (world units)
height=6.3
; 1 = first person: the eyes at the hero's own height, from his rig (sorceress 5.3 .. druid 6.5 units); height is then unused
height_auto=1
; added to that height (world units, ~0.24 m each)
eye_offset=0
; 1 = the camera goes up when the animation lifts the hero (the barbarian's Leap); the held upper body goes with it
follow_jump=1
; hip rise (model units) still taken for the stride's bob, not a jump; above twice this the camera follows it whole
jump_from=0.3
; pitch on top of the game's own camera (deg), more negative = looks higher; -60 = horizon; BodyWalk sends no head pitch
pitch=-30
; nothing closer than this (world units, ~0.24 m each) is drawn: hides the hero's own head and hair
near=0
; eye point to the right (+) / left (-) of where you look, world units (~0.24 m each);
; the hero's head is off the model's centre line, so without it the eye can sit on a shoulder
side=0
; eye point ahead (+) / behind (-) along where you look, without tilting with the head
forward=0
; 1 = the head turns about the neck (below and behind the eyes), not about the eyes: looking down shows the chest
neck_model=1
; the eyes above and in front of that pivot, cm (scaled to the hero)
neck_up_cm=10
neck_forward_cm=9
shadow_slope=0.5

[head]
; 1 = the head goes on between BodyWalk's updates by its last speed; 0 = as sampled, and FlatVR places the screen
; at the head pose of the sample's own moment (smoother: no guessing in the picture)
predict=0
; 1 = camera yaw follows the headset (needs BodyWalk with its Game Link plugin)
yaw_from_head=1
; -1 if turning the head left turns the view right
yaw_sign=-1
yaw_scale=1
; 1 = camera pitch follows the headset too (BodyWalk with head pitch)
pitch_from_head=1
; -1 if looking up tilts the view down
pitch_sign=1
; 1 = tilting the head sideways rolls the camera too
roll_from_head=1
; -1 if tilting the head right tilts the picture the wrong way
roll_sign=1

[flatvr]
; FlatVR as good as native OpenXR (docs/flatvr_sync.md); FlatVR only ([openxr] on=0), each 0 = as before
; pictures on FlatVR's frames: 0 our own timer; 1 each pair starts on FlatVR's next frame with its head, every other
; frame when a pair does not fit one (even); 2 on every new FlatVR head (more pictures, unevenly). The game's frame cap
; is written as twice the headset's rate then
frame_sync=0
; a FlatVR head older than this share of a frame when the last pair ends is let go and the next one waited for
frame_sync_late=0.5
; 1 = F4: the camera's pitch and roll are the headset's own (the horizon is the real one; [camera] pitch and the
; head's pitch at F11 not used; the roll right when looking up or down)
head_level=0
; 1 = F4: the camera moves with the head in the room (leaning, crouching), from where it was at the last F11
head_position=0
; 1 = straight ahead from FlatVR's room at our F11; BodyWalk's own Reset Center recentres the game too
room_centre=0
; 1 = straight ahead taken when a game is entered (the hero appears), as native OpenXR does
recenter_on_enter=0

[stick]
; 1 = exact: the stick goes through the real camera axes (sign/squash unused)
exact=0
; 1 = turn the left stick by the camera yaw, so forward is forward in the view
rotate=1
; -1 if after a head turn forward on the stick walks the wrong way
sign=-1
; <1 if diagonals drift after a turn (isometric screen squash); 1 = off
squash=1
; approximate mode: the stick turns by the camera yaw times this (0.5 = half)
angle_scale=1

[turn]
; 1 = right stick X turns the body (camera and walking); the game no longer gets the right stick
right_stick=1
; 1 = smooth turning at `speed` below, 0 = one snap of `snap` degrees per flick. Its own key, so switching keeps both the speed and
; the angle. An ini without it keeps its mode: there snap=0 means smooth turning and snap above 0 snap turning (an angle chosen later
; then starts from 30). Also in D2R VR Settings (Controls) and in the headset (the settings panel, Options). After bearstonem/d2r-pcvr (MIT)
smooth=1
; smooth turn speed at full deflection, deg/s (10 - 720); used while smooth is 1
speed=180
; degrees per flick of a snap turn (15 - 180); used while smooth is 0
snap=0
; -1 if pushing right turns you left
sign=-1

[stereo]
; 1 = native stereo by alternate frames: the game draws left eye, right eye, left...
; needs the FlatVR addon in the game, FlatVR picture source = UEVR (full-size SBS),
; VSync off and a high frame cap (180 fps = 90 per eye)
afr=1
; 1 = both eyes from ONE game frame: the frame is drawn twice (left, then right with the game time held),
; instead of one eye per frame by turns. Same pairs per second; the game itself updates half as often
pair_per_tick=1
; with pair_per_tick: 1 = the frame is drawn ONCE and the right eye is drawn again on the GPU from the same
; work with its own camera (one CPU pass, two pictures - nearly the mono frame rate); 0 = two passes a frame.
; D2R VR Settings, Performance, "3D in the headset": Stereo (this on) / Stereo - eyes by turns (afr alone)
replay_right=1
; 2 = the CPU draws the next frame while the GPU still replays the last one (faster); 1 = it waits for it
replay_ahead=2
; 1 = the pictures held to the headset's rate (FlatVR modes) only while FlatVR runs - without it nothing takes them. 0 = always
pace_flatvr_only=1
; ms of game time the right eye's pass gets instead of none: effects that skip a frame of no time
; (butterflies) are drawn in it then. 0.01 is enough; more moves the world between the eyes
right_dt_ms=0.01
; VR F4: props the game swings (hanging lanterns, chains, signs) move once a pair: where the right eye is
; drawn by a second pass (replay_right off, or before the replay is on) they were stepped again with the
; tiny time above and twitched. 1 = once a pair, 0 = in both passes. Idea: bearstonem/d2r-pcvr
props_once_a_pair=1
; 1 = the game's own view from above (F12 off) in stereo too: each eye turned about the hero by half of top_angle
top_down=1
; degrees between the eyes from above; more = deeper
top_angle=3
; eye separation in world units (hero ~7.5 tall ~ 1.8 m, so 0.27 ~ 6.4 cm); more = stronger 3D
; 1 = the world 1:1: eye distance and zero-parallax plane from the FlatVR screen and your head height (ipd and convergence below are then ignored)
true_scale=1
; your own eye distance, millimetres
eye_mm=60
; your height, metres - the scale of the world and of the hands (eyes at 0.936 of it); seated, still your standing height
user_height_m=1.75
ipd=0.16
; 1 if the eyes come out swapped (depth looks inside out)
swap=0
; distance that sits on the FlatVR screen (world units, ~0.24 m each); farther goes deeper behind it.
; 0 = parallel eyes (everything in front of the screen). Smaller = deeper
convergence=0
; the HUD nearer than the FlatVR screen, AFR only: moved apart per eye by the shader, % of the half screen (0 = on the screen)
ui_near=0
; the HUD is looked for below this height, 0 = top of the screen, 1 = bottom
ui_top=0.7
; how many of an eye's views the presented frame lags the newest one (0-3): the frame stamp and the sky go
; that far back. 0 by default: with 1 (meant for the game's own pipelining) head turns lagged and the sky
; floated in mono and eyes by turns (2026-10-10); pairs from one game frame always use 0
pipeline_depth=0
source=2
; the headset's rate (0..4: 72 75 80 90 120 Hz). VR ONLY: D2R VR Settings writes the game's own frame cap ("Framerate Cap" in its
; Settings.json) from it, and the plugin holds the game's presents to it ([stereo] pace). FLAT mode ([mode] platform=0) has neither:
; the game runs at the cap the PLAYER set in its own options. The player's own cap is kept before VR writes its own - cap_before - and
; the cap VR wrote last - cap_written - (both written by the program, not to be edited; -1 = none): flat mode puts the kept cap back at
; once on a switch in the settings, at START, and at the plugin's start. Nothing kept: nothing is written.
headset_rate=3
picture_ring=0
replay_proj=3
replay_shift_mul=1
replay_dlss=0
replay_view_mask=0
replay_positions=2
replay_prev=1
replay_copy=1
stamps=1

[openxr]
; PROTOTYPE (docs/plan_native_openxr.md). 1 = the game shows itself in the headset through OpenXR from its
; first frame: first (F4) and third person (F2) in stereo with "Stereo - one pass, two pictures", F1 and F3 too (views_3d
; below), menus and panels as a flat picture; FlatVR is stopped while it does, BodyWalk's panels are not
; in the headset then. 0 = FlatVR as always. Switches live (the session starts at the next F4 frame).
on=1
; local (the head where it is at the start) or stage (the room's floor)
space=local
; 1 = each eye's view narrowed to the window's shape (black above and below): square pixels, all the
; window's lines on a smaller angle - sharper; 0 = the whole view, the window's pixels stretched over it
; (the picture itself is right either way)
fov_crop=1
; 1 = each eye drawn as wide to the left as to the right: the game's interface (labels over monsters and
; items) is the same in both eyes and meets; 0 = each eye's own fov (fewer pixels wasted, the labels apart)
symmetric_fov=1
; a runtime that locates both eyes at the same point (eyes 0 mm apart in the log: no stereo, a double image that never merges)
; gets this gap between them, in mm, about the middle of the head; 0 = take the runtime's eyes as they come. 40 - 80
ipd_fallback_mm=64
; the distance between the two eyes of the stereo pair (native OpenXR; D2R VR Settings > Stereo > Native OpenXR). 1 = automatic: what the runtime's view
; poses say (above, a runtime that puts both eyes in one place gets ipd_fallback_mm). 0 = YOURS, ipd_mm millimetres (40 - 90; the settings' slider is 50 - 80):
; the two eyes keep their middle and their turns and stand ipd_mm apart - for a headset whose IPD was not picked up, or picked up wrong. Live.
; What the runtime measured is written by the game to d2r_vr_headset.ini ([headset] ipd_mm, 0 = it reports none) for the settings to show beside the slider,
; and the log says which is used, once and when it changes
ipd_auto=1
ipd_mm=63
; 1 = a headset whose displays are canted (each eye's view turned outward; the log says "each eye's own view from the head's frame"): both eyes are
; drawn and handed to the runtime in the head's frame, each with the frustum that covers its own view - the game's camera is one view for both eyes,
; and an eye handed over with its own turn came out crossed, the centre stretched. Parallel displays (under 0.25 deg between the views) are not
; touched. 0 = as before. Live
canted_eyes=1
; 1 = Steam Frame's controllers in their own layout when the runtime offers them (XR_VALVE_frame_controller_interaction): the right A / B,
;     the left D-pad down / up as the first / second face buttons (X / Y), the left View and the right Menu as the menu (vr/xr_profiles.h,
;     after bearstonem/d2r-pcvr). Taken when a session starts. 0 = the runtime's stand-in layout (Touch or Index), as before
frame_profile=1
; 1 = a Valve Index hand's grip is the handle's force sensor (how hard it is squeezed), so a relaxed hand round the handle is no grip;
;     0 = the fingers round the handle, as before. Other controllers: nothing changes. Live
index_grip_force=0
; first and third person: how far the head may lean away from the body, metres; walking farther in the room
; drags the body along (the camera stays in the hero). 0 = held to the body: turning only (with the neck model)
lean_m=0.1
; 1 = room-scale walking, VR first person (F4) with native OpenXR only (vr/room_walk.h): walk in the room and the hero walks the same way -
;     the game's own walking stick (the controller's left stick's) gets the direction and speed of your steps, so the game's pathing, walls,
;     walk / run and speed stay the game's (nothing moves or places the hero). The view stays with the head and the hero catches up under it;
;     turning, nodding or a lean inside roomscale_dead_zone_m walks nothing. The stick asks for your own walking speed (the game's speed
;     follows the tilt; the hero's speed at a full stick is learned as you play), so a steady walk is one steady tilt - with [input]
;     direct_walk=1 (the walking-stick hook) even a slow walk; with direct_walk=0 the gamepad's dead zone makes the game's slowest walk
;     faster than a room step, and the hero walks and waits. A brisk stride can reach a run (Run / Run Lock on). Never turns the hero. The controller's left stick wins while pushed. Blocked (a wall, a monster) and walking
;     on: the view leaves the hero by at most roomscale_cap_m, past it the room slides with you (as lean_m). A panel / the chat open: no walk.
;     F11 or the headset's recentre puts the hero under the head. The log says "room walk - live / holds / stands down". 0 = walking in the
;     room does not move the hero (the body follows past lean_m), as before. Live
roomscale_walk=0
; (roomscale_walk) how far the top of the neck may move off the hero's place before he walks, metres (0.03 - 0.5)
roomscale_dead_zone_m=0.12
; (roomscale_walk) a blocked hero: the farthest the view goes ahead of him, metres; past it the room slides with you (0.2 - 2)
roomscale_cap_m=0.6
; a controller that loses its place (out of the headset cameras' view: PS VR2, Quest) is held where it was by
; the head this long, ms, before the doll lets its arm go; 0 = let go at once
hand_hold_ms=1000
; 1 = FlatVR stopped through BodyWalk's Game Link before the session, started again after
stop_flatvr=1
; 1 = the game never hangs on a headset that is busy (2026-10-18: FlatVR through BodyWalk Lite, then back to Native - the runtime's xrWaitFrame never returned and the game
;     stood until Task Manager). On: xrWaitFrame and xrBeginSession run on a thread of their own and the game waits for them wait_frame_ms; if they have not come the VR frame is
;     left out and the game goes on flat (the log says so, and when they come); and no session is started over a FlatVR that holds the headset (its head sample moves) and
;     cannot be stopped (BodyWalk Lite has no Game Link): D2R VR Settings > Status says "close BodyWalk and restart SteamVR", and it is tried again every 10 s while FlatVR
;     runs. Needs a game restart. 0 = as before
busy_guard=1
; ms the game waits for xrWaitFrame / xrBeginSession (busy_guard) before it leaves the VR frame out; a normal wait is the headset's frame, 8 - 11 ms (20 - 2000)
wait_frame_ms=150
; everything in the headset this much darker (< 1) or brighter (> 1): the runtime scales the colours
; (XR_KHR_composition_layer_color_scale_bias), 1 = as the game draws it; 0.2 - 2
brightness=1
; outside first person (menus, loading; F1 and F3 with views_3d=0): the window as a flat picture this far ahead and this wide, metres;
; a panel open in a game (inventory, trade...) at [screen] menu_distance_m instead. F1 in 3D is a window of this size and distance
flat_distance_m=1.1
flat_width_m=2.3
; 1 = the flat picture (menus, loading, the title) and a menu's panel are placed in the room only once the headset says the head is
;     tracked, with the focus ours (until then they follow the gaze; a runtime that never says so is given 3 s), and come up in front
;     of you again when the focus returns after 2 s or more away (the headset taken off, the runtime's menu) - vr/anchor_gate.h, after
;     bearstonem/d2r-pcvr. 0 = the first 45 frames follow the gaze, then placed, as before. Live
menus_wait_tracking=1
; 1 = F1 (from above) and F3 (the game on your floor) in real 3D with the headset's own eyes, like F4 and F2: F3 is the
; diorama standing on your floor or table (walk round it, lean over it; the room's own floor when the headset has one), F1 the
; game's view from above in true perspective seen through a window of flat_width_m at flat_distance_m with your hero on its middle
; (lean to see round things); F1 is in true perspective then whatever [top] perspective says. Menus, loading and the character screens stay the flat
; picture. 0 = F1 and F3 as the flat picture, as before. Live.
views_3d=1
; 1 = (needs views_3d=1) in F1 and F3 the game's own mouse pointer (the gauntlet, the sword over a monster...) is drawn on the game's ground where its mouse
; points - the ground point a click would walk to, a few centimetres large, turned to your eyes, its tip on the point; the flat picture shows it too, in 3D
; there is no picture to show it on. Only drawn: the mouse, the clicks and the hero's movement are not touched. Shown while the game shows its pointer and the
; mouse is over its window. 0 = no pointer in F1 and F3. Live.
pointer_3d=1
; PROTOTYPE (docs/plan_laser_menus.md). 1 = a controller pointing at the flat picture of the menus (the title and
; character screens, a panel open in a game - never F1 and F3) is the mouse: its trigger clicks, with its grip
; held it right-clicks, a held trigger drags; the other hand's trigger is Ctrl, its grip Shift. What the laser
; takes is not BodyWalk's while it points at the picture; a stick or a face button gives the panel back to the pad.
; The game is kept in its controller layout meanwhile. laser_hand: 0 left, 1 right
laser=1
laser_hand=1
; 1 = (needs laser=1) the game's own item tooltip under the laser shows at once instead of after its 1000 ms, with
; the equipped-item comparison beside it, no Shift held: the game's tooltip and comparison, only earlier (two of the
; game's own queries answered at their call sites while the laser points at the menu). 0 = the game's delay and Shift
; F4 ONLY (VR first person): in F1, F2, F3 the game's own delay and Shift, as before.
laser_tooltips=1
; PROTOTYPE (docs/direct_input.md). 1 = native OpenXR with the plugin's own controls: it reads both controllers
; itself and gives the game its gamepad, actions and key commands, so BodyWalk is not needed for them (its virtual
; pad, buttons, gestures and tracking are ignored meanwhile; FlatVR and BodyWalk go on for everything else).
; The layout is in [direct] below. 0 = BodyWalk's controls. Live, with a native session.
; F4 ONLY (VR first person): in F1, F2, F3 and the flat modes BodyWalk's controls are the controls, at once, as if this were 0 -
; except the controllers in F1, F2, F3 while BodyWalk is not running ([direct] flat_controller, walk_flat_views, belt_flick_flat_views).
direct_input=1
; 1 = (needs direct_input=1) BodyWalk's WALKING still walks the hero in direct mode: BodyWalk is given your head and hands (no button, no stick of the
; controllers: it presses nothing a second time) so it can walk by your body (steps in place, an arm swing, a lean), and ITS LEFT STICK - nothing else of its
; gamepad, actions or commands - is mixed into the controller's left stick: each counts past the game's dead zone, together they add up (never past a full stick),
; pulling apart the stronger one wins, the same push twice is not doubled. A panel or menu open: the controller's stick only. BodyWalk has to be running and write its
; gamepad (Input Source: Game Link). The log says "BodyWalk's walk - COMBINED / IGNORED / DROPPED" and why. 0 = BodyWalk's walking is ignored in direct mode, as it
; was, and BodyWalk is given no headset. F4 only (F1, F2, F3: BodyWalk's gamepad is the gamepad whole, as always). Live.
direct_bodywalk_walk=1
; PROTOTYPE (docs/skill_wheel.md). 1 = a wheel in the headset (native OpenXR) of the controller's eight skill slots: the
; pad's B X Y RB and the same four with the left trigger held. Open it: hold the grip of the hand that does not point
; (the left one while laser_hand=1) and click the pointing hand's thumbstick. Point a wedge with the laser and pull the
; trigger: from then on the pointing hand's trigger casts that slot - the game's own pad button, nothing else; the centre
; is the basic attack again. EDIT SKILLS -> a slot -> a skill (or CLEAR SLOT) assigns a learned skill to the slot through
; the game's own setter. Names are the game's own text; icons come from a cache made out of YOUR installed game
; (tools/skill_icons/prepare_skill_icons.py, never shipped), without it the wheel shows names. 0 = nothing of it exists.
; skill_wheel_distance_m / skill_wheel_width_m: where the panel hangs in front of the head and how wide it is, in metres.
skill_wheel=1
skill_wheel_distance_m=0.8
skill_wheel_width_m=0.8
; (needs skill_wheel=1) how the skill panel opens. 1 = a LONG PRESS of the right thumbstick's click (about half a second, [direct]
; hold_ms; a short click is still the weapon swap; needs direct_input=1; the same long press closes it). 0 = the chord: the grip of
; the hand that does not point held + a click of the pointing hand's thumbstick. With 1 but BodyWalk's input (direct_input=0) the
; chord still works, since the long press cannot come then. Live. The panel works in VR first person (F4) only.
skill_wheel_open=1
; (needs skill_wheel=1) how the skill panel looks. 0 = the wheel above. 1 = TILES: a window made like the game's own controller skill
; dialog (drawn by the plugin, nothing of the game's art): two rows of six copper plates - A X B Y RB RT, and the same six with the
; left trigger held - red where a slot holds a skill, the pad button's mark under each; EDIT SKILLS shows every skill you have as a
; grid of plates. The same trigger cast and the same editor (the game's own setter); only the look. B X Y RB (and with LT) are cast
; by the trigger as before, A is the layout's attack as ever, LT + A is cast, RT and LT + RT are shown and editable but not cast. Live.
; With direct_input=1 (and [direct] not rebound) a tile also names the controller's own button that presses the slot.
; skill_wheel_distance_m is the tiles' distance too; skill_tiles_width_m is the tiles' window width in metres (its height follows).
skill_panel_style=1
skill_tiles_width_m=0.9
; (needs skill_wheel=1) 1 = EDIT SKILLS -> a slot shows a strip over the list of skills: All, your class's three skill trees (named as the
; game names them, in your language), General / Items (the town portal, the basic attack, a skill an item gives), each with how many
; skills it holds. The trees come from the game's own tables, read by tools/skill_icons/prepare_skill_icons.py into the icon cache (run it
; again after an update: a cache made before it has no trees, and then the one list stays). 0 = the one list of every skill. Live.
; Idea after bearstonem/d2r-pcvr (MIT).
skill_categories=1
; (needs skill_wheel=1) 1 = a RUN / WALK button on the skill panel's first page (a tile beside the first row of the tiles, a button in the
; footer of the wheel): the trigger on it presses the game's own run / walk command (the controller's, 0x23), the panel stays open, and it
; shows which one the game is on now. 0 = no button (the default): the same command is "Run / walk switch" in the button lists (D2R VR Settings >
; Controls, the headset's Left / Right pages: [direct] key = cmd:0x23; on a press, a long press, with the grip, or on a TOUCH of a control: [direct] <control>_touch)
; and "D2R key: Run / walk switch" in BodyWalk's bindings. Live.
; Idea after bearstonem/d2r-pcvr (MIT).
skill_run_walk=0
; (needs skill_wheel=1, direct_input=1) 1 = the right trigger and the right A button are the game's own RT and A skill slots, in VR first person: pull the
; trigger and the game casts the skill on its RT slot, press A and it casts the one on its A slot - and with the left trigger held, the LT + RT and
; LT + A slots (the left trigger is the second layer, as on a pad). The game's own buttons, so its mana, cooldown and animation. Put a skill on
; them in the panel (the tiles' look, skill_panel_style=1, shows the RT and A plates): EDIT SKILLS -> the RT or A plate -> a skill ("Attack" in the list puts the slot back). A slot with nothing, Attack or
; Interact on it leaves its control as it is today (the trigger attacks, A interacts), whatever [direct] makes of them. A slot you picked on the
; panel's first page still owns the trigger; a bottle in the hand, a javelin, the bow's string and a held grip are theirs. With
; [gameplay] melee_touch_only only the PLAIN attack on the trigger is withheld: a skill on RT casts. 0 = off (the default), the layout's trigger
; and A as ever. Live.
skill_rt_a=0
; docs/plan_laser_menus.md, step 2. 1 = in first person (F4) a menu or panel keeps the world in stereo
; around you and hangs the game's interface in front as a panel of its own (flat_width_m wide, at [screen]
; menu_distance_m); the laser points at it. 0 = the flat picture, as before. F1 - F3 always show the flat picture
menu_3d=1
; PROTOTYPE. 1 = a small settings panel in the headset, for native OpenXR without BodyWalk's menus: squeeze BOTH grips for a
; moment (a third of a second), then click a thumbstick (the same again closes it; B / Y or Menu close it too). From the moment
; both grips are squeezed the stick clicks are the panel's, not the game's (they swap weapons or show items there); a click
; right after the grips, or with one grip, is the game's as always. Point a controller at the panel and pull the trigger: the
; picture's distance and width, brightness, your height, the laser... Apply writes only what you changed into this file
; (the original is kept once as d2r_vr.ini.before-headset-menu; if the file was changed elsewhere meanwhile, the panel shows
; the new values instead of overwriting). Eleven pages (View, Options, Video, Body, Life, Look, HUD, Belt, Melee, Left, Right); two of them: Video - the VR render size ([render] vr_resolution_px / vr_resolution,
; the same keys as D2R VR Settings): presets from the window's own size to 4096 and the headset's own, a slider, the size the game
; draws now and what the headset recommends; Apply makes the game rebuild its picture (a few seconds frozen); Body - Calibrate body
; starts the T-pose measurement from inside the headset (the panel hides while its prompt runs and comes back with the numbers) and
; Forget measurement clears it ([calibration]), First-start guide shows the first-start guide again ([onboarding]). The first page's last row switches the game view, F1 - F4, like the F keys (the
; panel is F4's only: F1 - F3 close it; back to F4 by the F4 key, D2R VR Settings > Home, or a view action in BodyWalk's mapping).
; While it is open both controllers are the panel's: nothing of them reaches the
; game, and nothing the panel does sends a click or a key to the game. 0 = no panel, no chord, no cost.
; WITH THE SKILL PANEL IN THE TILES' LOOK ([openxr] skill_wheel=1, skill_panel_style=1) these pages are not a panel of their own but the
; SETTINGS TAB of the skill panel's window (tabs SKILLS | SETTINGS in its title plate): the long press of the right stick click opens it on
; the tab it was last on (the tab is remembered while the game runs), both grips a third of a second and a thumbstick click open it on
; Settings (on Skills they switch to Settings, on Settings they close it). It is closed as the skill panel is: the long press again, B / Y /
; Menu, or the pages' Close button; Calibrate body closes it for the measurement and it comes back on the Body page. The window FLIPS like
; pages along SKILLS | SETTINGS: View | Options | Video | Body | Life | Look | HUD | Belt | Melee | Left | Right: flick a thumbstick left or right (one flick, one page; it stops at the ends),
; tap the left grip (back) or the right grip (on), or click the arrow at the window's edge; dots at its foot show where it stands. While it is
; up the window takes both thumbsticks (the hero neither walks nor turns), and after it closes until each is back in the middle. Without the
; tiles' look the pages stay the panel of their own, as described above.
; F4 ONLY (VR first person): in another view it is as if this were 0 (an open panel closes).
headset_settings=1
; PROTOTYPE. 1 = BodyWalk's gesture RUNES in the headset (native OpenXR, with BodyWalk running): a shape you draw in the air with a hand
; is shown like a spell rune - its picture hangs in the room in front of you and lights up as far as your hand has drawn it, the
; path of your hand is a glowing trail ending in a bright blob at the hand, and when the shape is complete the picture flashes and
; fades (the gesture's own binding fires the game action: that is set in BodyWalk, not here). BodyWalk recognises the shape and
; decides what to show and where; the plugin only draws it, in the stage space BodyWalk placed it in, up to 4 runes at once (a
; picture and a trail each, 8 layers at most). A rune BodyWalk stops sending while it still shows fades out in 0.2 s. Nothing is
; drawn when BodyWalk is not running or sends no rune. 0 = nothing of it is read or drawn. Live.
; F4 ONLY (VR first person): nothing in F1, F2, F3 or the flat modes.
runes_draw=0
; 1 = pulses in the controllers (native OpenXR only; the headset's runtime drives the motors): a blow of yours that lands,
; a belt potion taken or drunk, the laser's click on a menu, a pick-up or an opening. They only watch the game, never change it.
; 0 = silent, as before. haptics_scale: every pulse stronger or weaker (0.1 - 2, 1 = the usual)
; F4 ONLY (VR first person): no pulse in the other views.
haptics=1
haptics_scale=1
; 1 = a vibration action of its own for each hand, bound to that hand's motor only (some runtimes sent a pulse of the shared,
;     hand-filtered action to the wrong hand - bearstonem/d2r-pcvr); taken at a session start. 0 = one action for both hands, as before
haptics_hand_actions=1
; 1 = each pulse is stopped by xrStopHapticFeedback when its time is up, from a thread of its own (also while the game loads or
;     stalls): some controllers (Steam Frame's) buzzed on past a short pulse. Live. 0 = the runtime ends a pulse by itself, as before
haptics_stop=1
; The motor the controllers have. 0 = by the headset's name (the log says it: "haptics - motor: ..."). A PlayStation VR2's Sense controllers
; under SteamVR do not show short, gentle pulses (the Quest's do): the low-life heartbeat (0.14 - 0.47 for 28 - 40 ms) was not felt there while
; a hit (0.72 for 45 ms) was. 2 = weak: that beat is lifted to 0.55 - 1.00 and at least 45 ms, in the same order (stronger stays stronger).
; 1 = plain: every pulse as it is made, whatever the headset. Only the low-life beat is touched; every other pulse is what it was. Live.
haptics_motor=0
; FLAT MODE ([mode] platform=0, "Flat: on the monitor, mouse and keyboard") starts no headset session, ignores [openxr] on and
; [render] vr_resolution_px, makes no square window and writes no resolution: the game uses the window and resolution the player
; set in the game's own Options.
; square_window=1: in VR ([mode] platform=1, native OpenXR and FlatVR alike) the game window SQUARE, window_size pixels a side
; (D2R VR Settings' "Square game window" writes it into the game's Settings.json, the game starts in it). The player's own window is
; kept before it is made square - window_before (WxH) and window_mode_before, written by the program, not to be edited - and put
; back in flat mode: at once on a switch in the settings, at START, and at the plugin's start (the game writes the size its window
; had back at its quit). Nothing kept: nothing is written.
window_size=1920
square_window=1

[direct]
; The layout of [openxr] direct_input=1 in the world (no panel open). In a menu the controllers are the game's own
; gamepad, control for control (A B X Y, sticks and their clicks, grips = bumpers, triggers, menu = Start) - not
; changeable. Both sticks are the gamepad's: left walks, right turns.
; One line is one control: <control> = <output>[, <output>[, <output>]]
;   controls: left_trigger left_grip left_x left_y left_stick left_menu
;             right_trigger right_grip right_a right_b right_stick right_menu   (stick = the stick's click)
;   with the same hand's grip held:  left_grip+left_menu = ...   (a chord; it replaces the plain line then)
;   outputs:  pad:A B X Y LB RB LT RT L3 R3 Start Back Up Down Left Right   (the game's own gamepad buttons)
;             action:attack interact inventory map swap view1 view2 view3 view4 view5 viewnext recenter
;                    (attack = pad A that never picks up; interact = pick up / open / talk onto a target only)
;             cmd:<number or name>   a key command of the game, held as long as the control is: cmd:0x25,
;                    cmd:Show items (Alt), cmd:Potion - belt 1  (the names of the game's controls)
;             none                   nothing
;             action:skillpanel      ask for the skill panel (the wheel / the tiles) to open or close - for a long press
;             action:pause           the PAUSE MENU: the game gets Esc (its pause menu, or the open panels close) - for a long press
;             action:quivernext, action:quiverprev   the javelin quiver ([hands] javelin_quiver): the next / previous skill of the next throw (F4 only)
; A line left out keeps its default (below, commented); "x = none" unbinds it.
; The finger ON a control instead of a press (capacitive touch - a Touch controller, PS VR2 on SteamVR, an Index controller report it; a Vive, WMR or simple one does not):
;   <control>_touch = <output>   for left_trigger left_x left_y left_stick right_trigger right_a right_b right_stick (not the grips, not the menu buttons). It acts ONCE when
;                    the finger ARRIVES, nothing while it stays, once more the next time; F4 only, in the world (not in a menu, not with a panel of the mod's own up). None by default.
;                    Touch and press are two lines: the touch comes first, then the press of the same control does what ITS line says. The log says which touch inputs the controller
;                    reports and which touch lines are set. e.g. right_b_touch = cmd:Run / walk switch  (the game's run / walk switch on the thumb touching B)
; The same lines as a list, no typing: D2R VR Settings > Controls > Buttons of the controllers (it writes these keys, and takes a line
; out when you pick what the default does anyway).
;
; Long presses. A control with a "<control>_hold" line is hold-or-tap: let go before hold_ms it is a TAP - its plain
; line acts, as a short press of the button, when you let go; held to hold_ms the hold line acts ONCE at that moment
; and the tap is gone. A key command in the plain line (Alt) is the exception: it is held at once, as it always was,
; and let go when the hold fires. In a menu the same table of the game's own pad holds: a long press of the left stick
; click is the inventory button (it closes the inventory, the command is a toggle), the right click stays R3 at once.
; Not while a panel of ours (the skill wheel) is up, and not with a chord on the grip (that acts at once).
; hold_enabled=0: no long presses at all - every click acts the moment it is pressed.
hold_enabled=1
; ms to hold, 200 - 1500
hold_ms=500
; 1 = a quick click of the left stick shows / hides the map (the click held is still Alt, show items); 0 = Alt only, as before.
; Only while the left_stick line below is not rebound.
left_stick_map=1
; 1 = (needs hold_enabled=1) a LONG PRESS of the left menu button is the PAUSE MENU: the game gets Esc (its pause menu, or the open panels close). A short press is
; the inventory as before (it opens when you let go). A Touch controller has no right menu button, so the left one carries both. ON PS VR2 (SteamVR runs its controllers
; as Touch controllers) the "left menu button" is the OPTIONS button of the RIGHT controller: SteamVR's own remapping gives a game that one and no Create button. 0 = the
; menu button is the inventory the moment it is pressed, as before. Any other button or long press can have it: left_menu_hold below, or the list in D2R VR Settings. F4 only. Live.
pause_button=1
; 1 = (needs [openxr] direct_input=1) the PLUGIN'S OWN CONTROLLER in VR F1, F2, F3 while BodyWalk is not running: the F4 layout below as the game's gamepad there - the right
; trigger attacks, A picks up, B / X / Y the skills (left trigger held: the second row), the right stick click swaps weapons, the left stick click is Alt (a quick click:
; the map), the menu button the inventory, the sticks; in a menu the game's own gamepad. The same [direct] lines rebind it as in F4, minus the skill panel's and the pause menu's long presses.
; Still F4 only: gestures, hit by touch, the bow's draw, throws, the skill wheel, aiming by the hand (in F1 and F3 the hero attacks where he faces). BodyWalk running (its Game Link
; alive, or its gamepad report moving): nothing changes, its gamepad is the gamepad whole. A real gamepad answering too: ours is added to it, never over it.
; 0 = no buttons from the controllers in F1-F3 without BodyWalk (the walk and the potions below only). The log says "the plugin's own controller is the game's pad". Live.
flat_controller=1
; 1 = (needs [openxr] direct_input=1) FLATVR WITH THE PLUGIN'S OWN LAYOUT: in FlatVR, with a BodyWalk that hands its raw controllers to the game through Game Link
; (Tracking 2: BodyWalk 1.83 with the D2R VR link), the layout below and everything of F4 (the belt, gestures, the bow, the quivers, the shoulders, the pause menu)
; run on those controllers as in native OpenXR: GAME LINK DIRECT - BodyWalk's Mapping and its gamepad are not read at all (no double presses), in F1, F2, F3 the
; plugin's own controller acts as without BodyWalk ([direct] flat_controller); BodyWalk's walk comes through Game Link (its Output "Game Link") into the controller's
; stick ([openxr] direct_bodywalk_walk). The camera and the arms keep BodyWalk's head and hands. An older BodyWalk: its Mapping and gamepad, as before (the log says
; "BodyWalk sends no raw controllers"). D2R VR Settings > Status says "BodyWalk: Game Link direct". 0 = BodyWalk's Mapping and gamepad in FlatVR. Live.
flatvr_controls=1
; 1 = (needs [openxr] direct_input=1) in VR F1, F2, F3 the controller's left stick walks the hero when BodyWalk is not running - the game's own
; walking code (the dead zone, the stop), the stick turned into the game's frame the way BodyWalk's stick is in that view (F1 from above: forward = up on the
; screen). A panel or menu open: the stick is the menu's. BodyWalk running (its Game Link alive, or its gamepad report moving): nothing changes, its gamepad is the
; gamepad whole. 0 = no walking from the stick in F1-F3 without BodyWalk. The log says "walking in VR F1-F3 - ..." and why when it does not walk. Live.
walk_flat_views=1
; 1 = (needs [openxr] direct_input=1) BELT POTIONS in VR F1, F2, F3 (not F4): hold the LEFT TRIGGER and flick a thumbstick - either one: left = belt column 1, up = 2,
; right = 3, down = 4 (the game's own belt keys 1-4, the press the hand makes when it drinks from the belt). One flick, one potion: bring the stick back to the
; middle before the next one; a stick already pushed when the trigger went down does nothing until it has been to the middle. While the trigger is held the left
; stick does not walk. The trigger alone does nothing. Without BodyWalk only (BodyWalk running: nothing changes). 0 = no potions from the sticks there.
; The log says "belt flick - ..." for each potion and why a flick was not taken. Live.
belt_flick_flat_views=1
; The QUIVER's two buttons ([bow] quiver=1): while a bow's string is drawn (F4), quiver_next loads the next bow skill into the bow and quiver_prev the previous one - set on
; the slot the release presses, through the game's own skill setter. They are taken from the layout ONLY while the string is drawn; at any other time the button does what the
; lines below say. A button of a fixed hand: left_x left_y left_stick left_menu right_a right_b right_stick right_menu; or by the hand's job, for either handedness:
; string_primary / string_secondary / string_stick (the hand that takes the string: A / B / the click on the right), bow_primary / bow_secondary / bow_stick (the bow hand);
; none = off. Triggers and grips are the draw's own and are not offered.
quiver_next=string_secondary
quiver_prev=string_primary
