staff_aim_yaw=0
; 1 = a bow or crossbow is always aimed with the left hand, whatever the weapon set
ranged_left=1
; 1 = with a staff (both controllers), spells and attacks go from the left hand to the right one
staff_two_hands=0
; the aiming hand of each weapon set (swap I / II in the game): 1 = left, 0 = right
set1_left=0
set2_left=0
xbow_aim_yaw=0
; 1 = the bow's own string, limbs and arrow follow the drawing hand: with the first-person arms on the controllers and
;     a bow in hand, while the draw gesture (the string hand pulled back) is on, the game's own bow bones are posed
;     from the hands - the string at the hand, the limbs folded to it, the arrow on the string, snapping back at the
;     release. Any bow a hero holds (15 models, recognised by its bones; a rig it does not know keeps the game's
;     animation). No bow is drawn over the game's: it is the game's own bow, its bones moved. 0 = the game's own
