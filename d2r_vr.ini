[weight]
; F4 with the arms on the controllers: a melee weapon held alone has weight (vr/weight.cpp). It lags
; behind a hard swing, a two-handed one wants both hands, a spear held by its end is slower than held
; where the game holds it. A hand holds it while its grip is squeezed, where the grip closed on the
; shaft; let a grip go and that hand lets go (the other keeps it). Both let go, it falls to the floor:
; take it up there, or squeeze the grip of the game's hand away from it to call it back into that fist.
; First person (F4) only, with BodyWalk's tracking or native OpenXR (with or without direct_input). The grips keep their
; other jobs: next to the belt a grip is a potion, behind a shoulder it is the weapon swap (that hand takes no weapon); hit by
; touch follows the weapon as drawn - the hand that carries it swings it, one let go (falling, lying) strikes nothing. With it
; on, [hands] staff_free_left and the other two-handed settings give way to it; off, they work as ever.
; A javelin or throwing weapon in the right hand follows the same rules; with the throw gesture's throw_by_grip a grip let go as a throw
; does not drop it (the game's own throw takes one out of the hand and a new one sits there).
; 0 = the weapon sits fast in the game's grip, as before.
on=1
; % of the weapon's real mass (a sword 1.2 kg, a two-handed sword 2.5, a polearm 3.5); 0 = none. 50 by default (half the real mass felt best in the headset); 100 = the real mass
feel=100
; % of the hands' strength (with gravity_feel it also stiffens the wrists; the force ceilings scale either way)
strength=100
; Gravity feel: the weight is gravity. The wrist is soft near the line of the controller and firm far off it, so a sword held out level sinks a few
; degrees, a polearm or a two-hander in one hand sinks a lot (two hands hold it much better), a swing down is helped by the weight and lifting up
; is slowed by it, and a hard cut is still followed. 0 = the old stiff wrists (the weight only shows as a lag); gravity_pct and damping_pct work either way.
gravity_feel=1
; % of the real g (9.81 m/s2) on the weapon's steel; 0 = no gravity, only inertia. (A weapon you let go always falls at the real g.)
gravity_pct=100
; % of the wrists' dampers (100 = nearly critical); the damper follows the controller's speed, it is not a drag
damping_pct=100
; The physics of the held weapon: 0 = our own (the gravity feel above); 1 = the weight-physics library, d2r_vr_weight.dll beside the plugin (d2rl-vrcam.dll), when
; it is there - without it the mod keeps its own model and says so in the log. Gravity, damping, weight and strength work with either.
hands_model=1
; hands_model 1 only: the weapon's weight in the palm while it is held (a comfort setting: nothing sags, a heavy weapon turns about the hand)
hands_model_palm=0
; How a hand holds the shaft: 0 = our own (the grip alone holds it, the second hand of a long shaft slides while its grip is squeezed, the fingers have the game's own grip pose);
; 1 = the grip library's, d2r_vr_grip.dll beside the plugin (d2rl-vrcam.dll), when it is there - without it the mod keeps its own way and says so in the log. With it: the hand sits on
; the wood with its palm touching it and the knuckles along it, the fingers close until they meet it, the second hand of a long shaft is held by its grip (tight: the point and the
; turn fixed) or, grip let go and trigger squeezed, loose (it slides along the shaft and turns about it); pulses when a hand comes within reach, closes and lets go. F4 only.
grip_model=1
; The hero's strength decides how heavy a weapon feels: his Strength (the game's stat: points, gear and all) times his class' multiplier below, against the weapon's own Strength
; requirement (the game's Weapons table), scales the steel's mass (lag, sag, swing inertia) and the hands' strength - in the mod's own physics and in the weight-physics library alike.
; A Barbarian with plenty of Strength swings a Great Sword or a Maul easily, a Sorceress feels the same weapon heavy. 0 = the weight is the same for every hero, as ever. F4 only.
hero_strength=1
; how much it matters, %: 100 = twice the margin over the requirement halves the lag; 0 = not at all; 200 = twice as much
strength_effect=100
; each class' multiplier of its Strength stat, %: a class that is stronger than its stat says gets more (the game starts a Barbarian at 30 Str, a Sorceress at 10)
str_amazon=100
str_sorceress=80
str_necromancer=90
str_paladin=110
str_barbarian=200
str_druid=95
str_assassin=100
str_warlock=95
; how near the shaft (cm) the grip takes it
grab_cm=12
; a new weapon in the game's hand (its grip never squeezed yet), the other hand on it too: pulled this far (cm) away, it lets go
let_go_cm=25
; two hands on a long shaft (a staff, a spear, a polearm, a two-handed sword, axe or mace): the second hand slides along the shaft with its
; controller while its grip stays squeezed (the first hand holds where it took it); off an end, or pulled away, it lets go. 0 = it holds where it closed, on every weapon.
slide_second_hand=1
; ... on which kinds of weapon (1 = the second hand slides, 0 = it holds where it closed: tight, the point and the turn fixed). A staff's, a spear's and a polearm's second hand runs
; along the pole; a sword's, an axe's or a maul's stays on the hilt. The same list drives the mod's own way of holding and the grip library's. A short weapon (a dagger, a wand, a
; scepter, a one-handed sword) has no shaft to slide on and is not in the list.
slide_second_hand_sword=0
slide_second_hand_axe=0
slide_second_hand_mace=0
slide_second_hand_staff=1
slide_second_hand_polearm=1
slide_second_hand_spear=1
slide_second_hand_javelin=0
slide_second_hand_other=0
; Where the SECOND hand takes a weapon the other hand holds. 0 = anywhere along it, within grab_cm of the shaft, as ever. 1 = a sword, a dagger, a scepter, an axe or a mace is taken only
; on its hilt (the haft, for an axe or a mace): from the pommel to the guard and a few centimetres past it, not on the blade or the head. A grip there takes nothing (it is free for a belt
; potion, say); the staff, spear, polearm and the other long weapons keep the whole shaft. The mod's own way of holding and the grip library alike. F4 only.
grip_hilt_only=1
