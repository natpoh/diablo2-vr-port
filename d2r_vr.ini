[debug]
; 1 = after every released throw (throw_gesture / throw_by_grip) the log tells for 5 s what the game does: the hero's mode changes (his throw animation), the
;     potion's missile (made at all? how far it flew, its life, the moment it is gone) and any effect missile that appears where it ended (the explosion).
;     Read only; about 20 lines a throw. 0 = silent
throw_trace=1
; 1 = for every attack the plugin presses (a bow's shot, a blow, a throw), from its press until 1.5 s after it is let go, the log tells what the game does with it:
;     every map click (its type, its point, the Stand Still and Run flags it carries, the hero's mode and his distance from the point), the command the game's click
;     builds from it (flags, target, point, walk / run id) and every command through the client's funnel with its way back up the stack (return addresses as RVAs) -
;     to find out why the game sometimes runs the hero off after a shot. Read only; about 15 lines a shot; needs [gameplay] attack_in_place = 1. 0 = silent
shot_trace=0
; 1 = paint the toolbar's strip that [hud] hide = 1 empties a see-through magenta, to see its edges while hide_up_pct / hide_down_pct are tuned. Live
hide_strip_tint=0
; 1 = every pair, view, hero pose and present to d2r_vr_frames.csv beside this file (and FlatVR its per-frame pose trace)
frame_log=0
; 1 = for a stutter that comes with a swing or a hit (vr/frame_trace.h): a pair - both eyes of one game frame - longer than frame_trace_ms is told in
;     the log, the worst one of each second: where its time went (the game's own frame, xrWaitFrame, the left and right pass, XR end, how much of it
;     the draw thread really worked against waited), what the PLUGIN spent in it (the pose hook - once per skeleton the game poses -, the hit observer,
;     the aim hooks, the server's unit lookups, the 100 ms probe job of hit by touch, the haptic call, the host's log lines; the log time inside a hook
;     is in both), the situation it fell in (idle / walking / a swing / a hit landed) and the access violations caught since the last pair. Every
;     10 s one line counts the pairs by situation and how many of each were long, and the plugin's mean cost a pair - send that log in. Only measures
;     and writes lines; a clock read or two in each hook while on, one relaxed load when off. Any view. Live. 0 = off
frame_trace=0
; the pair length, ms, above which frame_trace tells a pair (2 - 1000). 15 = a little over a frame at 72 Hz; at a steady 20 ms a pair (50 frames a
; second) raise it to 30 so only the real stutters are told
frame_trace_ms=15
; 1 = the plugin's log lines are written by a thread of their own (vr/log_queue.h): the thread that logs - the game's, in the middle of a frame - copies
;     the line into a ring and goes on, instead of waiting for the host's file write (about 1 ms a line on the machine this was found on, which writes
;     20 - 50 lines in a second of swinging: about seven from the pad poll at every press). Every line is kept, in order; a full ring is written by the
;     thread itself; a line that waited more than 50 ms says so at its end (the host stamps the time it WRITES the line); at a crash and at unload what
;     waits is written first. Live. 0 = each thread writes its own lines, as always
log_async=0
; 1 = rig_pose with no draw gesture: squeezing the grip of the hand opposite the bow's draws the string (to try the
;     posing before the gesture exists); 0 = only the draw gesture draws it
bow_rig_grip=0
; 1 = the bow draw's vectors drawn in the headset (needs [hands] bow_draw=1 and the shader D2R_DepthFog.fx of the same build):
;     the bow's axis (cyan), the touch sphere round the string (green with the free hand inside it, red outside, deeper
;     once the string is taken), the hands (white = bow, yellow = free), the fixed point 16 cm behind the grip (small cyan),
;     the bow's own string (small magenta), the pull line from the string to the free hand (orange) and the draw's aim
;     (blue) - and a line of numbers in the log five times a second. 0 = nothing drawn, nothing logged
bow_vectors=0
; 1 = one line in the log for every bow shot of the draw gesture (read only, nothing is changed in the game): the ms after the release to the
;     wire's press, the pad's A reaching the game, the hero's attack mode (and back to neutral), the body's turn toward the aim (began, done), the
;     server's arrow create (the game's missile create is hooked, read only) and the first missile the client shows. 0 = nothing logged
bow_latency=0
; 1 = one line for every compute shader the game makes (its size and FNV-1a hash), in the log, at the game's start:
; how to check that light_bounds_fix's match (2164 bytes, 7C22D74C89A5305C) is the shader this game build has
log_compute_shaders=0
; melee touch (docs/plan_melee_by_touch.md): 1 = skip the server's "hostile? a wall between?" check, so any live monster
;     the blade meets is attacked - to find out whether that check is what stops a touch. Not for play: a touch on an ally
;     or through a wall then presses the attack too (the game's own rules still decide what comes of it)
melee_touch_unchecked=0
; melee boxes (vr/melee_boxes.h): 1 = draw the capsules hit by touch tests, in VR first person (F4), with [gameplay] melee_touch on - the
;     blade's cyan, every monster in the scan yellow (pale where the game's own checks refuse it: not hostile, or a wall between), the
;     monster a touch was accepted on for half a second red (the game's attack key was pressed) or magenta (the Direct hit route took
;     it) - and a line of numbers 5 times a second in the log (the nearest monsters' capsule size and height, the blade's distance
;     to them, the stroke speed). Only a drawing and a log: it changes nothing in what melee_touch does. Live. Off: nothing is
;     drawn, scanned or computed for it
;     The blade turns GREEN while its fastest part moves at the speed a contact needs ([gameplay] melee_min_speed, in a stroke), and a swing leaves marks
;     (vr/melee_marks.h): a WHITE ball at the tip where the speed was reached, an ORANGE one where it fell below again, and the tip's
;     path as a thin trail (cyan where a contact would not count, green where it would) - to tune melee_min_speed and
;     melee_stroke_start_cm by where they land in your swing
melee_boxes=0
; melee_mark_ms: 0..5000, how long the balls and the trail stay after the swing, ms (800); 0 = no marks, no trail. Live
melee_mark_ms=800
; The blade of hit by touch tuned live (First person, F4). The blade is the weapon bone as drawn (the red line's frame) from its origin
;     along its Y, as long and as thick as the plugin has it for the weapon's kind; what melee_boxes draws is the blade the touch tests.
;     They tune only where the touch counts a hit - never the game's reach, rolls or attack.
; melee_blade_length_pct: 50..150, % of the kind's own length (100 = as is)
melee_blade_length_pct=100
; melee_blade_butt_pct: 0..150, % of the weapon's own length BEHIND the weapon bone (the bone is the middle of the grip of a staff, spear or
;     pole-arm: the weapon runs on behind it to its butt); 0 = none
melee_blade_butt_pct=100
; melee_blade_radius_cm: 0 = the kind's own radius, else 0.5..15 cm
melee_blade_radius_cm=0
; melee_blade_flip: 1 = the tip on the other side of the bone's Y, for every weapon (the dagger's already runs along -Y by default)
melee_blade_flip=0
; The same two numbers for the THROWN kinds only (a javelin, a throwing knife or axe), on top of the general ones above: their blades are estimates
;     and the general sliders move every weapon. The javelin's head lies along the bone's -Y, 1.04 m from the bone (the bone is at the hand):
;     measured on two screenshots; its butt (0.30 m, along +Y, behind the hand) is a guess; the knife's and the axe's were not seen. With
;     melee_boxes=1 the capsule's far end - the head side - should reach the weapon's real point. melee_thrown_length_pct: 50..250, % of the
;     head side; melee_thrown_butt_pct: 0..300, % of the butt side behind the bone
melee_thrown_length_pct=100
melee_thrown_butt_pct=100
; a unit the game draws itself, four of it round the hero (test): its .json, e.g.
; data/hd/items/misc/potion/lesser_healing_potion.json; empty = none. Placed once per value, live
engine_unit=
; [hud] ordinary_mob_bars: how the plate is taken off the screen. 0 = the game's anchor call answers "on the screen" at a point far
; outside it, so the plate is drawn where nobody looks; 1 = "not on the screen" (d2r-pcvr's way: the game's plate update then
; skips its anchor and may leave the plate where it was). Live
mob_bars_style=0
; [hud] low_hp_vignette: where the tint starts, 0.2 - 0.9 (0 the middle of the view, 1 the middle of an edge; 0.5 = half way out)
; and how square the rings are, 1.5 - 8 (2 = ellipses, 2.5 = rounded rectangles). Live
low_hp_inner=0.5
low_hp_roundness=2.5
; [hud] hand_vitals: 1 = the palm's normal taken the other way (the BACK of the hand shows the panel), for a runtime whose grip pose
; has its X axis the other way round. The mod assumes the OpenXR grip pose's +X is out of the left palm and into the right one. Live
hand_vitals_flip=0

; [weapon_<kind>] (bow, crossbow, sword, axe, mace, scepter, wand, staff, polearm, spear, dagger, throwing, javelin,
