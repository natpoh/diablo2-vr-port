; 1 = the weapon's two attach bones (one on each wrist) are kept [hands] carry_cm apart along the weapon's own axis ([hands] carry_axis): the game lays a two-handed weapon along the
; line between them, and with both in ONE point that line has no length and the weapon is drawn squashed flat along its length (the staff as a dark disc, the grip and the red line
; right). 0 = both in one point (what 2c95c81 did).
attach_apart=1
; the closed fist's middle from the right controller, its own axes, cm (mirrored for the left)
fist_x=0
fist_y=0
fist_z=0
; Grip fit: a hand that TAKES the weapon (it closes its fist on the shaft: the second hand, a hand that takes it over from the other, the game's hand taking it
; up again) is laid on the shaft as it is drawn: the middle of its palm onto the shaft's axis (the red line, [debug] phantom_ray) at the place it took it, the line
; through its knuckles along the shaft (the roll about the shaft stays the controller's), the fingers closing with the grip's squeeze - also with [hands] fist off.
; fist_x/y/z above decide WHERE along the shaft the hand takes it. The hand the game holds the weapon in keeps the game's own pose; only its corrections below act.
; 0 = the hands are drawn at the controllers, as before.
grip_fit=1
; 1 = the taking hand sits on the shaft the way the game's own grip has the base hand: that hand's palm offset from the axis (across the hand and out of the palm) and
; the lean of its knuckle line are measured live (its own corrections below included) and given to the taking hand. 0 = the taking hand's palm exactly on the axis.
grip_fit_like_base=1
; 1 = the fingers and the thumb of a hand that TAKES the weapon have the game's own weapon-grip pose: the pose of the hand the game holds it in (wrapped round the shaft, the
; thumb on it) is read off the game's animation and put on the taking hand, mirrored as that hand needs (in the hand's own frame, whichever way the rig labels its bones). It is
; held as it is while the hand holds the weapon - not driven by the squeeze - and the fingers open as the hand lets go (or hands over); independent of [hands] fist. For a staff, a
; spear, a sword in two hands: whatever the game's hand does on that weapon. 0 = the fingers close with the squeeze (and with [hands] fist off, only that).
grip_fit_fingers=1
; Live corrections, PER HAND (right_grip_* / left_grip_*), whatever state the hand is in (the game's hand as placed, a hand that took the weapon, carrying it or not; one
; hand or two), in the SHAFT'S OWN FRAME at the place the hand holds it, turned as the hand holds it (so a fix found for one grip is right at any roll): x along the
; shaft (+ toward the tip), y across (+ toward the fingertips), z up (+ out of the palm), cm; rx the roll about the shaft, ry the tilt about the across axis, rz the
; tilt about the up axis, degrees. The same numbers on the two hands make mirror images. The weapon never moves with them, only the hand. All zero = no change.
right_grip_x=0
right_grip_y=0
right_grip_z=0
right_grip_rx=0
right_grip_ry=0
right_grip_rz=0
left_grip_x=0
left_grip_y=0
left_grip_z=0
left_grip_rx=0
left_grip_ry=0
left_grip_rz=0
