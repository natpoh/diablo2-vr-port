; in place of BodyWalk's Body Height / [stereo] user_height_m and [arms] scale. 0 = those, exactly as before
; F4 ONLY (VR first person): the other views, and a measurement asked for there, keep the old numbers.
use=0
; the Settings button adds one to this; the game then shows the T-pose prompt in the headset (native OpenXR, a STAGE floor)
measure=0
; 1 = a valid measurement is stored below (written by the game after a good T-pose, which also sets use=1); 0 = none ("Forget the measurement")
version=0
; your eyes over the floor standing, metres; and the span from one controller's grip to the other's with the arms stretched out level
eye_height_m=0
arm_span_m=0

[body]
; 1 = nothing above the pelvis follows the game's animation (bind pose; arms and hands from the controllers, fingers keep the grip)
