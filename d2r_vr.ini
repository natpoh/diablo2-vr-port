[gameplay]
; New ways to play with the hands (native OpenXR, first person F4). melee_touch, shield_smite and melee_direct are off until ticked in D2R VR Settings;
; a key below marked "1 (default)" / "1 (the default)" is on when it is missing.
; F4 ONLY (VR first person) - these and the Direct hit do nothing in F1, F2, F3 and the flat modes.
; attack_in_place: 1 (default) = VR first person (F4): every attack the plugin presses - the layout's trigger, hit by touch, a throw, a
;     shot released from the bow's draw, a pad skill button whose skill the skill panel knows - is pressed together with the game's own
;     key command "Stand still" (0x24, the Shift key), so with nothing under the point the game's click is an attack in place and
;     never a walk to that point. The attack waits a few ms until the game has the command down (the log says how long, one line a
;     press: "stand still - press ..."). Skills that move the hero (Teleport, Charge, Leap, Leap Attack, Whirlwind, Dragon Flight)
;     and pick-ups are left alone. While an attack is held the hero stands still. The same for a CLICK on bare ground (a mouse, the
;     laser, a program - the game's click on the map, 0xFE3B0, with no unit under the pointer): the click gets the Stand Still flag, so
;     it is the skill in place and never a walk there; a click on a monster, an item, a door or an NPC stays the game's own. (The log
;     says so once, then a count every 10 s: "stand still - N click(s) on bare ground set to Stand Still".) F3, where a click on the
;     floor walks by design, and every other view: as before. 0 = attacks and clicks as they were. Live.
attack_in_place=1
; block_stray_clicks: 1 (default) = VR first person (F4): while you play in the world with no panel or menu open, the game gets no mouse button
;     at all. The log of 2026-10-14 16:26 had four left clicks "from a device" (Windows: hardware, not our SendInput) at the rhythm of a bow's
;     draw and release; they run the hero forward instead of the shot. Panels, menus, the title and character screens (the laser clicks there),
;     mouse look ([input] mouse_look) and [bow] mode 2's own Shift + click are untouched; the release of a dropped press goes with it.
;     The log says "stray click - ... DROPPED" with the origin, the device type and the controllers' triggers (first 30, then every 2 s). 0 = clicks as
;     they were. Live. F1 - F3 and the flat modes: as before.
block_stray_clicks=1
; block_stray_walk: 1 (default) = VR first person (F4): the client's one funnel for the player's commands (0xFABE0: command 1 walk / 3 run to a point,
;     2 / 4 to a unit, 5.. skills, 0x42 the stick's direction) drops a walk or run to a POINT that comes out of a click on bare ground (the map click
;     0xFE3B0 type 0 / 1 / 3 / 4 with no unit under the pointer, no Stand Still). Never touched: the stick (0x42), walks to a unit (pick-up, NPC, door,
;     waypoint), every skill (Teleport, Leap, Charge), the stick's stop (click type 6) and Force Move (11 - 13). A walk to a point from the pad's casts or
;     from any other caller is only written to the log ("stray walk - noted, NOT dropped ..."), so a log can say what it is. 0 = commands as they were. Live.
block_stray_walk=1
; block_attack_run: 1 = VR first person (F4), with block_stray_walk on (0 by default: the log of 2026-10-14 18:46 shows the game's pad cast of an aimed bow shot IS a run to the aim point, so dropping it leaves no shot at all; the cause is being fixed): the game's own RUN to a point out of the pad's cast of an attack of ours (a bow
;     shot, a hit by touch, a throw: pressed with Stand Still) is dropped as well. A log of 2026-10-14 had the bow's shot, aimed at a point far out along the
;     hand, run the hero forward there in six shots of twenty (command 3, 3 ms after the pad's A went down, Stand Still held). A walk to a monster or an item
;     is not touched. 0 = such a run is only noted. Live
block_attack_run=0
; aim_no_chase: 1 (default) = VR first person (F4): the cause of that run, not only its stop. Before every pad cast the game asks the controller's target (the
;     monster nearest the aim, 0x18DD60 from the function 0x1454A0 that makes the cast's flags) and, with one found whose reach test passes, takes Stand Still OFF the
;     cast so the hero may attack that monster. A cast along the hand (spell_aim, bow_aim, throw_aim, the bow's draw, a throw by gesture) has the target taken away at
;     the resolver and at the click - that is the aim - so a click was left with no target and no Stand Still: a click on the ground, a run to the point. With this on
;     that first question is answered none too, the cast keeps Stand Still and is the same cast in place as with no monster near. 0 = as before. Live.
aim_no_chase=1
; shield_smite: 1 = with Smite on one of the pad's ten skill slots and a shield on the left arm, a hard bash of the left
;     shield through a monster casts one Smite at it - the game's own: the slot's button pressed for 65 ms (180 ms on the left trigger's row, let go once the game has the cast) and the touched
;     monster handed to the cast as its target. Reach, mana, cast rate, animation, damage, stun and knockback stay the game's.
;     A shield at rest does nothing, nor does a bash with the right trigger down. 0 = the shield casts nothing.
shield_smite=1
; shield_smite_min_speed: m/s, 0.3 .. 8, default 0.8 (what the shield always used). The speed the left shield must be moving at for a bash to count: a
;     shield moving slower does nothing, however it touches a monster. The bash's OWN number: melee_min_speed (hit by touch's blade) does not apply to the
;     shield. The shield's speed is your left HAND's: its movement plus its turn times the shield's length (0.4 m), frame to frame. Lower it and the speed
;     that may begin a bash (1.5 x, at most 1.2) and the speed that counts as rest (0.56 x, at most 0.45) go lower with it; from 0.8 up those are as
;     before. With [debug] skill_triggers=1 the shield's capsule turns green while a bash would count, white / orange balls mark where its speed reached /
;     fell below this number and the log line "skill trigger shield bash:" shows its speed against it. Read live.
shield_smite_min_speed=0.8
; shield_smite_stroke_cm: cm, 2 .. 30, default 8 (as it always was). How far the shield must have moved within 0.12 s for a movement to become a bash at
;     all (about 0.7 m/s at 8 cm - so a lower bash speed needs a shorter start distance too to matter). Apart from melee_stroke_start_cm. Read live.
shield_smite_stroke_cm=8
; melee_touch: 1 = hit by touch. With the arms on the controllers and a melee weapon (or bare fists) in hand, the blade you
;     swing through a monster's body (a stroke of at least 0.8 m/s, started by 8 cm of movement; a blade held still or
;     waved slowly does nothing) picks the target and the moment of the game's own attack: the attack button (pad A, never
;     picking up) is pressed on the contact and the monster you touched is handed to it as its target. The game's own
;     animation, reach (out of reach it walks the hero up, as a click on a monster does), hit rolls, attack speed, mana and
;     ammo stay the game's; nothing is called that attacks. A monster is hit once per stroke; an ally, or a monster behind a
;     wall (the server's own answer), is not. The skill on the attack button is what is pressed. 0 = as before.
melee_touch=1
; melee_min_speed: m/s, 0.3 .. 20, default 0.8 (as it always was). The speed a blade must be moving at for a contact to count: a blade
;     moving slower does nothing (so a gentle poke at a monster hits only if you set it low). One number for every weapon. Read
;     live. The speed is the BLADE's, measured on the weapon as drawn, frame to frame, in the room: the faster of its two ends (the tip of a
;     sword) and, at a touch, the speed of the point of the blade that touches (the tip of a blade swinging about your hand is fast, the
;     end you hold is not) - not the hand's: a grip at the root or in the middle, a big arc with a still wrist and a poke read what the blade
;     really does. A normal swing's tip reads about 3-6 m/s: with [debug] melee_boxes=1 the blade's capsule turns GREEN while its fastest part
;     is at or above this (a touch counts with the part that touches, the tip)
;     and the log line "melee boxes:" shows the blade's speed (and its peak) against this number, so it can be set by feel. Lower it
;     and the speed that may begin a stroke (1.5 x, at most 1.2) and the speed that counts as rest (0.56 x, at most 0.45) go lower with
;     it; from 0.8 up those gates are as before (what they gate is now the blade's speed, not the hand's).
melee_min_speed=6
; melee_stroke_start_cm: cm, 2 .. 30, default 8 (as before). How far the BLADE (its faster end as drawn - the tip of a sword - not the hand)
;     must have moved within 0.12 s for a movement to become a stroke at all; a monster is hit once per stroke. Read live.
melee_stroke_start_cm=15
; Which contact counts as a strike (vr/strike_direction.h; Settings > Strikes). The swing engine (melee_min_speed, melee_stroke_start_cm) counts any fast movement of the blade through a monster; these rules sit on
;     top of it, for each weapon kind, and only decide whether a contact counts as an attack - the game's own attack, its damage, rolls and reach are untouched, nothing is scaled. A refused contact does not use
;     the monster up: a later contact of the stroke, or the next blow, counts. All of them off: every contact counts, as before. Live. F4 only. The kinds the touch swings (the <kind> of the keys below):
;     sword axe mace scepter wand staff polearm spear dagger claw orb unarmed other javelin throwing (mace = maces, war hammers, clubs and flails; javelin and throwing only with melee_touch_thrown)
; melee_toward: 1 (the default) = a contact counts only while the point of the blade that touches the monster is moving TOWARD it: the angle between its velocity and the line from that point to the
;     nearest point of the monster's body axis is under melee_toward_deg. An overhead blow down, an uppercut from below, a sideways sweep into the monster and a thrust all go toward it; the wind-up (the
;     head going up and back, away from a monster in front of you), the pull-back after a blow and a graze along its side do not. 0 = every contact counts, whichever way the blade moves
melee_toward=1
; melee_toward_deg: 20 .. 89, default 60 (the cosine of the angle above 0.5). Lower: only a movement straight at the monster counts; higher: a glancing blow counts too; 89: anything that is not away
melee_toward_deg=60
; melee_toward_<kind>: 1 (the default for every kind) = that kind is judged by melee_toward; 0 = its contacts count whichever way the blade moves
melee_toward_sword=1
melee_toward_axe=1
melee_toward_mace=1
melee_toward_scepter=1
melee_toward_wand=1
melee_toward_staff=1
melee_toward_polearm=1
melee_toward_spear=1
melee_toward_dagger=1
melee_toward_claw=1
melee_toward_orb=1
melee_toward_unarmed=1
melee_toward_other=1
melee_toward_javelin=1
melee_toward_throwing=1
; melee_head_only: 1 (the default) = for the kinds ticked below only a contact of the HEAD of the weapon counts - the outer melee_head_pct of the blade - not the shaft or the handle. 0 = off
melee_head_only=1
; melee_head_pct: 10 .. 100, default 40: the head is this part of the blade's length, from the tip
melee_head_pct=40
; melee_head_only_<kind>: 1 = that kind is judged by the head rule. The default: mace and scepter 1, every other kind 0
melee_head_only_sword=0
melee_head_only_axe=0
melee_head_only_mace=1
melee_head_only_scepter=1
melee_head_only_wand=0
melee_head_only_staff=0
melee_head_only_polearm=0
melee_head_only_spear=0
melee_head_only_dagger=0
melee_head_only_claw=0
melee_head_only_orb=0
melee_head_only_unarmed=0
melee_head_only_other=0
melee_head_only_javelin=0
melee_head_only_throwing=0
; melee_amplitude: 1 (the default) = a contact counts only when the head has travelled at least the kind's amplitude in this stroke - a real swing, not a flick of the wrist or a tap. The base is melee_amp_pierce_cm,
;     the amplitude of the piercing kinds (wand, spear, dagger, claw, orb, unarmed, javelin, throwing, other); edged kinds (sword, axe, polearm) need it times melee_amp_edged_x, blunt kinds (mace, scepter) times
;     melee_amp_blunt_x, the staff times melee_amp_staff_x; melee_amp_x_<kind> is a factor of a kind's own. Not a speed: the least speed (melee_min_speed, melee_min_speed_<kind>) is separate. A stroke begins only
;     after the blade has moved melee_stroke_start_cm, so an amplitude under that adds nothing. 0 = no swing size is asked
melee_amplitude=1
; melee_amp_pierce_cm: 1 .. 60, default 8: the least swing amplitude of the piercing kinds, cm
melee_amp_pierce_cm=8
; melee_amp_edged_x / melee_amp_blunt_x / melee_amp_staff_x: 0.5 .. 6, defaults 1.4 / 2 / 1.75: the amplitude of those kinds as a multiple of the piercing one (11.2 / 16 / 14 cm at 8)
melee_amp_edged_x=1.4
melee_amp_blunt_x=2
melee_amp_staff_x=1.75
; melee_amp_x_<kind>: 0 (the default) = the kind follows its family's factor above; else 0.25 .. 8, its own factor times the piercing amplitude
melee_amp_x_sword=0
melee_amp_x_axe=0
melee_amp_x_mace=0
melee_amp_x_scepter=0
