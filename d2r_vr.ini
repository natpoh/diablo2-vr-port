; disable auto-target for spells: 1 = with [bow] mode 4, a spell that flies (Fire Bolt, Charged Bolt, Teeth...
;     as the game's skill table says) goes exactly along the hand, the game's auto-target and aim assist off for that
;     cast; ground spells, summons, curses and auras keep the game's targeting. 0 = as before, with the auto-target
spell_aim=1
; the bow drawn with both hands (native OpenXR, VR first person F4 only - the other views keep everything as before; a bow in hand): the trigger of the hand without the bow, pressed at the bow's nock
;     point (about 16 cm behind its hand), takes the string; pulled back along the line to the bow (at least 28 cm apart, 12 cm
;     more than at the nock, for 0.12 s) and let go, it presses the game's own button ONCE for 65 ms - the attack, or the pad
;     button of a skill slot (bow_draw_button) - aimed along the draw line, inside the game's 50-cell limit. The game does
;     the rest: its animation, attack rate, mana and arrows; the length of the pull adds no damage, arrows or speed. A trigger
;     pressed anywhere but at the string shoots nothing (bow_draw_only=1, below) or stays the plain trigger (bow_draw_only=0).
;     Menus, a change of weapon, a lost hand, a recentre and a pull over 1.1 m end a draw with no shot. 0 = the trigger as before
bow_draw=0
; 1 = with a bow in hand (F4) the bow shoots only by a draw and a release. In the grab zone (the green sphere of bow_vectors) the free
;     hand's trigger - and its grip, if bow_draw_start uses it - is the draw's: NOTHING bound to it in [direct] fires there (plain, hold
;     or chord outputs), at the press, in the pull or at the release. Away from the zone only the control's SHOTS are dropped -
;     action:attack, pad:A, pad:RT, and the skill the skill wheel picked - and every other output it is bound to works as bound (a pad
;     skill button, a key command, another action, the belt, the shoulder swap, the wheel's chord). The draw's own release still presses
;     its attack or skill button (bow_draw_button). Other weapons, other views and the menus are as before.
;     0 = a trigger pressed away from the string is the plain trigger, as before. Live
bow_draw_only=1
; what the release presses: 0 the game's attack (a bow's own arrow); 1 B, 2 X, 3 Y, 4 RB - the pad button of that skill slot
;     (whatever skill the player put there: Magic, Fire, Cold, Ice, Exploding, Immolation, Freezing, Guided Arrow, Multiple Shot,
;     Strafe); 5..8 the same slots with LT held (the second bank)
bow_draw_button=0
; what takes the string: 0 the trigger of the hand without the bow (as before); 1 its grip - the natural grab, let go of
;     to shoot; 2 whichever of the two is pressed at the string (the draw is then that control's). A grip pressed away from
;     the string keeps its other duties (the belt, the shoulder swap...); at the string it is the draw's
bow_draw_start=0
; where the string is: 1 = the string of the bow in the hand (read off the posed bow's own rig, the place it rests at),
;     used when it lies 5 to 45 cm from the grip, else the point below; 0 = always a point 16 cm behind the grip along the
;     bow. The touch radius round it is 28 cm either way. [debug] bow_vectors shows both points
bow_draw_nock=1
; the green grab zone: how near the touch point the free hand has to be to take the string, cm - the zone's radius (5..50).
;     28 = as it was. Smaller: the hand has to be nearer the string (a press elsewhere is not a draw more often).
;     Live; [debug] bow_vectors draws the zone at exactly this radius, red outside it, green inside
bow_draw_reach_cm=28
; the zone's centre moved along the bow's axis, cm (-25..+25): + away from the bow's grip (further toward the archer),
;     - toward the grip. For the bow's own string and the fixed point (bow_draw_nock) alike; lay the zone on the string you
;     see with [debug] bow_vectors on. 0 = as it was. Live
bow_draw_nock_shift_cm=0
; the least pull that shoots, cm (5..40): the string hand has to be pulled back this far from where it took the string for a
;     release to shoot - and the hands at least 16 cm + this far apart, for 0.12 s (12 cm: 28 cm apart, as it always was). Less:
;     a shorter pull shoots; more: a longer one is needed. A shorter pull shoots nothing and the bow goes back to rest. Live;
;     [debug] bow_vectors draws a ring round the bow hand at the radius from which a release shoots - red until the free hand
;     has pulled far enough, green after
bow_draw_min_pull_cm=12
; arrows along the hand, no auto-target: 1 = with [bow] mode 4 and a bow or crossbow in hand, the attack and the
;     bow's skills go exactly along the hand (the game's target and aim assist off for that shot)
bow_aim=0
; the same for javelins and throwing weapons, apart: 0 = the game's auto-target helps a throw (hard to aim in VR)
throw_aim=0
; 1 = native OpenXR: a hand reached behind either shoulder, its grip pressed once, swaps weapon set I / II - the game's own
;     "Swap weapons" (command 0x2C) pressed as its key would be, with all of the game's gates; the hand rests there 0.12 s first,
;     the grip pressed there takes no belt potion, reaching back without the grip (a javelin's wind-up) does nothing. The
;     game's weapon set tells whether it took; a swap that did not is not repeated. 0 = as before (FlatVR: a BodyWalk gesture
;     zone bound to "D2R key: Swap weapons" does the same). F4 ONLY (VR first person)
shoulder_swap=0
; the hand for it: 0 right, 1 left
shoulder_swap_hand=0
; THROW SKILL: the throws below cast the game's own Throw skill (skills.txt: no target needed - a cast at a spot). The pad's A is bound to Attack,
;     which the game refuses for a throwing potion and gives a knife, axe or javelin only for an enemy at the point. throw_auto_skill (below) makes the
;     game read the throw's A press as Throw; without it (0) the pad button of the skill slot that holds Throw is pressed (B X Y RB, or with the left
;     trigger: put Throw on one with the skill wheel), else the A attack
; native OpenXR, with [bow] mode 4: 1 = a javelin or throwing weapon in the hand is thrown by a throwing motion: hold the right
;     trigger, swing the hand, let go. The release presses the game's own attack once and the attack goes out along the way the
;     hand was going (no auto-target); the game's missile, speed, ammunition and animation stay. Needs a hand travel of 18 cm at
;     1.4 - 12 m/s ending within 80 ms of the release, the trigger held 0.08 - 3 s; a hand at rest, a jab with the trigger up or a
;     menu open throws nothing. The right trigger belongs to the gesture with such a weapon: it does not attack on its own.
;     0 = as before. F4 ONLY (VR first person)
throw_gesture=0
; native OpenXR with [openxr] direct_input=1 (Controls without BodyWalk), [bow] mode 4: 1 (the default; it does nothing without native OpenXR
;     and direct_input) = the same throw by the right GRIP instead of the
;     trigger: with a javelin or throwing weapon wielded the grip is the weapon "in the hand" - squeezed it is held, as long as you
;     like; swing the hand and let the grip go at the end of the swing and it is thrown (the game's own attack, aimed along the
;     hand's motion; same numbers: 18 cm at 1.4 - 12 m/s, the last fast moment within 80 ms of the release). A grip let go with the
;     hand at rest or slow throws nothing. The right grip belongs to the throw with such a weapon: no belt bottle, no shoulder
;     swap with that hand. Wins over throw_gesture when both are 1; the trigger then attacks as usual. 0 = as before.
;     F4 ONLY (VR first person)
throw_by_grip=1
; the help of a throw by gesture (throw_gesture, throw_by_grip): a throw flies along the line the hand was going; a hostile monster inside a cone of this
;     HALF-angle round that line (degrees, 0 - 45; 0 = off) snaps the aim point to itself - the one nearest the line, then the nearest. Nothing in the
;     cone = exactly along the hand. The game's own range, line of sight and hostility checks stay the game's. A throwing potion counts only the
;     monsters within +-25% of its landing distance
throw_autoaim_deg=15
; 1 = a throw's A press is read by the game as its Throw skill by itself (the slot -> skill reads that pick the cast answer Throw while a throw is live and a
;     throwing weapon or potion is in hand): no skill slot needed. 0 = the throw presses the pad button of the slot that holds Throw
throw_auto_skill=1
; throwing potions (Rancid Gas, Oil, Choking Gas, Exploding, Strangling Gas, Fulminating) with throw_gesture / throw_by_grip: the potion goes to a spot on the
;     ground where a real object would land, thrown with the PEAK velocity of the hand in the 0.15 s before the release (the release itself is
;     the end of the swing, where the hand has slowed) from the height of the hand. This scales the distance, % (50 - 1500): a gentle swing in
;     a living room is far from a game screen's distances, so the default is 800 (the same as [weight] throw_reach_pct: a comfortable swing of
;     3 - 5 m/s lands 15 - 25 m out); the result is held to 3 - 48 cells (about 30 m; the game refuses a point more than 50 cells off).
;     With [weight] on (F4) the weight model works the whole throw out itself - heading, landing, with ITS reach - and this is the fallback only
throw_potion_reach_pct=800
; when the game's own throw of a throwing potion happens (throw_gesture / throw_by_grip). 0 = at once, at the release: the weapon-weight model's potion is
;     taken by the game and vanishes, the game's missile flies to the spot (25 cells a second, after the ~1/3 s of the hero's throw animation) and
;     explodes there. 1 = the potion's model flies the trajectory that was thrown (needs [weight] on: its flight time is the wait), and when it lands the
;     game's Throw is pressed at its landing: the game's missile still has to fly from the hero, so the explosion follows the landing. Without the
;     weight model's account of the throw it is 0 (at once)
potion_throw_mode=0
; EXPERIMENTAL, offline only (the potion's create is the local server's). 1 = a thrown potion explodes where and when the model lands: the game's throw is pressed
;     AT THE RELEASE (the hero's throw animation plays while the model flies, the least input lag), and the one call that creates the game's potion missile
;     (at the animation's action frame, about 1/3 s later) is given a start cell on the way to the landing, so that the missile's life - its distance to the cast
;     point, a cell a frame - ends exactly as the model lands; the game's own explosion (damage, gas, sound) happens there. Everything else stays the game's
;     (the animation, the gates, the stack's spending). Needs [weight] on. When the model's flight is longer than the game's own potion takes, the game's own
;     flight is left alone. If the hook is not found, or it faults once, it is off for the session and the throw is as before. 0 = as before
throw_direct=0
; ONE switch for a thrown potion that only OURS is seen (VR first person, F4; needs [weight] on and the throw by gesture or grip): 1 = potion_model_flies, potion_hide_game and
