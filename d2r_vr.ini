[mode]
; The settings program's Home page and F1..F4 in the game: 0 flat (monitor), 1 VR (headset + BodyWalk)
platform=1
flat_view=3
; VR: 1 above, 2 third person, 3 the game on the floor, 4 first person with the body
vr_mode=4
vr_mode_order=2

[update]
; The settings program only (vrcam does not read it): ask bodywalkvr.com for a newer version when it opens;
; develop=1 the beta channel. It only shows the news and a Download button that opens the page in the browser.
check=1
develop=0

[top]
; VR F1 through our camera: the game's view from above in true perspective (FlatVR screen's FOV, real stereo)
perspective=1
tilt=-15

[table]
; VR F4, the game on the floor: the hero's height there (the field's size), the ground above the floor, where it is put (F4, F11)
