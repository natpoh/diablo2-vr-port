[arms]
; hero's arms: 0 = the game's animation, 1 = test pose (both arms straight ahead), 2 = the VR controllers
mode=2
; 1 = shrink the hero's head and neck away, for a camera right at the eyes (looking down shows the chest)
hide_head=1
; arm reach on top of the hero/your height ratio
scale=1
; -1 if the arms swing to the wrong side when the hero turns away from where you look
facing_sign=1
; both hands moved, cm: up (+) / down (-), forward (+) / back (-), right (+) / left (-)
up=0
forward=0
side=0
; % of [camera] distance the hands take along: 100 = they hang off the camera (match your real hands), 0 = off the hero's eyes (always in reach)
follow_camera=100

[body]
; 1 = nothing above the pelvis follows the game's animation (bind pose; arms and hands from the controllers, fingers keep the grip)
lock=1
; the hero turns to where the camera looks: 0 = no (the game's facing), 1 = above the pelvis only, 2 = whole body
turn=2
; degrees added to where the hero faces (arms too) if he stands sideways: try 90 / -90 / 180
yaw=0

[hands]
; where the hero's facing (the doll's binding) comes from: 1 = his TransformComponent in the game's renderer,
; found from his skeleton - bound at once after a weapon swap, an area change or a load; 0 = the memory search
; (docs/doll_binding.md). 1 falls back to the search by itself if it does not read or is a frame late.
facing_source=1
; while no facing reads, the last one is held this long, ms (0 = the doll lets go at once)
facing_hold_ms=4000
; the wrist the game hangs a crossbow on, for its grip: 0 right, 1 left (D2R: left)
xbow_hand=1
; the crossbow's shot line (where the bolt flies, where the left hand takes it), turned onto the model, degrees
xbow_line_pitch=34
xbow_line_yaw=15
; arms mode 2: 1 = the hands turn with the controllers, 0 = they only follow the forearm
wrist=1
; degrees on top of the controller, in its own axes: pitch tips the hand up/down,
; yaw swings it left/right, roll turns it about the forearm (mirrored for the left hand)
pitch=10
yaw=-5
roll=5
; a staff runs through the right hand too: that point moved along the hand's own axes, cm
staff_x=0
staff_y=0
staff_z=0
; 1 = with a staff both wrists turn with it (the game's grip), not with the controllers
follow_staff=1
; 1 = a staff sits fast in the right hand; the left is free and takes it with the grip, sliding along it
;     (0 = the staff hangs between both hands; follow_staff and staff_x/y/z apply only then)
staff_free_left=1
; 1 = a hand holding nothing closes into a fist with the controller's grip and relaxes when it is let go
fist=1
; with staff_free_left: the grip takes the staff only with the left hand this near it, cm (farther: let go, press again near it)
staff_grab_cm=20
; with staff_free_left: the left hand on the staff moved along its own axes, cm, until the fist closes round the shaft
left_staff_x=0
left_staff_y=0
left_staff_z=0
; 1 = a spear, polearm or two-handed axe/mace held like the staff: fast in the right hand, the left takes it with the grip and slides along it
polearm_two_hands=1
; 1 = a two-handed sword (nothing in the other hand) in the right hand; the left grip takes the hilt next to it.
;     It points where the right hand does. A barbarian's two-handed sword beside another weapon stays in one hand.
sword_two_hands=1
; where the left hand takes the hilt, cm from the right fist toward the game's left hand (negative = the other way)
sword_left_at_cm=10
; how far the left hand slides along the hilt either way with the controller, cm (0 = one place)
sword_slide_cm=4
; the left hand on the hilt moved along its own axes, cm, until the fist closes round it
left_sword_x=0
left_sword_y=0
left_sword_z=0
; the wrist the game hangs a spear/polearm or a two-handed sword on (0 right, 1 left) - used only when
; its attach bones do not tell (the log says which: "attach bones did not tell")
spear_hand=0
; a staff: the wrist it hangs on (0 right, 1 left) and its shaft as the bone's axis (-2), every hero
staff_hand=0
staff_shaft_axis=-2
; the left hand once it holds any two-handed weapon (not the crossbow): moved along its own axes, cm - one for all (Weapon Adjust)
left_hold_x=-3.5
left_hold_y=-3.5
left_hold_z=0
; and turned about its own axes, degrees, round its point on the shaft
left_hold_pitch=-5
left_hold_yaw=-18
left_hold_roll=0
sword_hand=0
; the same for a two-handed axe or mace (right, seen 2026-10-06)
axe_hand=0
; the hilt as the sword bone's own axis, from the right fist toward the pommel: +-1..3 = x y z (the axes the
; Debug "Draw the axes" shows: X green, Y blue, Z yellow); -2 = against the blue, which runs to the tip; 0 = from the game's grip
sword_hilt_axis=-2
; the same for the haft of a two-handed axe or mace (-2: against the blue, which runs to the head) and of a spear/polearm (0 = from the game's grip)
axe_shaft_axis=-2
spear_shaft_axis=-2
xbow_stock_axis=2
xbow_gun_frame=1
xbow_model_roll=0
xbow_model_pitch=0
xbow_model_turn=0

[fist]
; how far a free hand closes, % of a full fist: <hero>_close with the grip squeezed, <hero>_open with it let go.
; Per hero - each class's hand is built differently (the full fist rolled the paladin's fingers into his palm).
amazon_close=65
amazon_open=20
sorceress_close=100
sorceress_open=20
necromancer_close=100
necromancer_open=20
paladin_close=65
paladin_open=20
barbarian_close=100
barbarian_open=20
druid_close=100
druid_open=20
assassin_close=100
assassin_open=20
warlock_close=100
warlock_open=20

[bow]
; attack along the hand when A is pressed: 0 off; 1 left stick while A is held (the game ignores it);
; 2 = A becomes Shift + left click along the hand's ray (works, but flips the game's UI to mouse);
; 3 = the stick turns the hero to the hand for turn_ms first, then A goes through (pad only);
; 4 = while A is held, the game's own attack vector points along the hand - turn the hand while firing
mode=4
; mode 3: how long the hero is turned before the attack, ms (more if he does not turn in time)
turn_ms=80
; mode 4 with a bow: the attack point this many grid cells out along the hand (more = finer aim)
range=30
; degrees the aim along the hand is turned about the vertical, if the shots land beside where the hand points: + = right, - = left
aim_yaw=-22
; the same for a staff (in place of aim_yaw while one is held), -45..45
staff_aim_yaw=0
; 1 = a bow or crossbow is always aimed with the left hand, whatever the weapon set
ranged_left=1
; 1 = with a staff (both controllers), spells and attacks go from the left hand to the right one
staff_two_hands=0
; the aiming hand of each weapon set (swap I / II in the game): 1 = left, 0 = right
set1_left=0
set2_left=1
xbow_aim_yaw=0

[render]
; room rings drawn around the hero, 1-8; with fog 4-6 is enough
rings=2
; rooms built per pass at most
build_rate=16
; houses, props and units are drawn out to this many world units (the game: 150)
model_radius=300
; memory pools grown at start (vanilla 12 / 70 MB); more rooms need more
render_pool_mb=64
entity_pool_mb=280
; 1 = keep the game's own height fog. Only the act 2 town has it; from our camera its edge is a hard
; line across the picture with a pale veil above (the game's camera never sees it). 0 = vrcam sets it to 0
game_height_fog=0
; walls in front of the hero: 0 see-through as the game draws them, 1 solid but in F1 (from above
; they stay see-through, the hero in sight), 2 solid in every view
solid_walls=1

[third]
; F12 a second time: the third-person view, the camera this far back from the eye point (world units)
distance=17
; and the eye point this high above the ground
height=11

[input]
; 1 = first person like a shooter: the mouse turns the view (pointer kept in the middle), W A S D walk; F9 toggles in the game
mouse_look=0
; degrees per pixel of mouse travel (mouse look and middle-button drag)
mouse_speed=0.15
; VR view F2 (third person) like flat: 1 = it starts with mouse look (the mouse turns the camera, the pointer is the
; crosshair in the middle, a click goes there; F9 frees the pointer) and W A S D walk where the camera looks (the
; game's own keyboard move); 0 = as before: mouse_look decides, W A S D are the game's own keys (Move Up goes north)
vr_keys_walk=1
; VR views F2-F4: 1 = BodyWalk's stick walks the hero through the game's own walking code (mouse and controller
; mode alike), the gamepad's left stick is kept from the game outside menus; 0 = walk through the gamepad's stick
direct_walk=1
; 1 = the game's pad is BodyWalk's own report, read directly - no virtual pad (ViGEm) needed
bodywalk_pad=1
; 1 = pad A only attacks; picking up / opening / talking is the BodyWalk action "D2R: Pick up / interact"
a_attack_only=0
; flat mode (platform=0): 1 = W A S D walk through the game's own keyboard move, relative to the camera; the game
; stays in mouse/keyboard mode, a click goes to the middle of the screen (where you look). 0 = the old virtual pad
flat_keyboard_move=1
; flat mode with flat_keyboard_move=1: 1 = the game sees no pad at all (no A/B/X/Y prompts); 0 = a real pad goes through
flat_no_pad=1
; flat mode, mouse look on: 1 = a click with no target under the crosshair attacks in place at it (a shot), never walks there
flat_click_shoot=1
; flat mode, mouse look on: 1 = the pointer is a crosshair in the middle, not the game's gauntlet
flat_crosshair=1
; its picture: a bare name in reshade-shaders\Textures or a full path; no transparency = black is see-through; empty = built in
crosshair=D2R_Sky_ours\D2R_Crosshair.png

[debug]
; 1 = every pair, view, hero pose and present to d2r_vr_frames.csv beside this file (and FlatVR its per-frame pose trace)
frame_log=0

; [weapon_<kind>] (bow, crossbow, sword, axe, mace, scepter, wand, staff, polearm, spear, dagger, throwing, javelin,
; claw, orb, unarmed, other): with the arms on the controllers, the weapon in the hand moved x y z (cm) and turned
; pitch yaw roll (degrees) in its holder's own axes. The settings window's Weapon Adjust tab edits the one in hand.
