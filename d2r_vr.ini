potion_throw_ours=0
; 1 = the game's OWN thrown-potion missile is not drawn while OUR potion (the weight model's) flies - visual only: the renderer's visual-init callback is hooked to LOOK at the
;     entities of the hero's potion missile in the window of the throw just pressed (a monster's missile, a trap's, an arrow are never touched), and their world matrix is put
;     under the ground by a hook of the renderer's world-matrix function. The game's missile still flies, hits, spends the stack and explodes as ever, and its explosion is drawn.
;     Only while ours flies (needs [weight] potion_model_flies); F4 only. Not found, or a fault: off for the session, the game's potion is drawn as before. 0 = as before.
