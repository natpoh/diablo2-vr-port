; 1 = A CHANGE OF THE GAME'S TIMING, for melee. The game's blow lands at one frame of the hero's attack animation - the action flag of the class's attack rows
;     (<class>A1<weapon class> and <class>A2<weapon class>: the plain attack and the skills that play it - Zeal, Bash, Berserk, Sacrifice, Vengeance, Power Strike... - and the
;     Paladin's Smite, <class>S1) in its AnimData table: a Paladin's one-hand swing at frame 7 or 8 = 0.28 - 0.32 s after the animation starts; in the user's log the touch's press to the
;     game's hit was 317 - 339 ms (the Direct hit: 15 - 53 ms). On: those flags are moved to quick_strike_frame, so the blow (its hit roll, damage and the monster's reaction) comes up to
;     ~0.3 s EARLIER inside the same attack. The animation's length and the attack rate stay - the next attack can still start only when the animation ends; mana and wear are the
;     game's but happen earlier; a monster's hit in those first ~0.3 s no longer cancels the blow. Every melee attack of the class; VR first person (F4) only, offline only (the game's own
;     tables in this process); put back exactly when this is off, the view changes or the plugin unloads. Never the bow's, the crossbow's or a throw's rows. The log says what was
;     moved ("quick strike: ..."); with [debug] bow_latency the melee press->hit line also names the animation row the hero is on. 0 = as the game has it. Live
