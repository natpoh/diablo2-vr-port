ordinary_mob_bars=0
; Low life: the edges of the view tint deep red and beat like a heart ("lub-dub", then a rest) while the hero's life is under the
; threshold - faster (60 up to 90 beats a minute) and redder the lower it goes, in after about a second under it and out after about
; a second and a half above it (5 points above, so it does not flicker at the edge). A colour over each eye's picture at its edges
; only: the picture is never scaled, moved or shaken, the middle stays clear. Nothing when dead, in a menu, outside a game, or
; anywhere but first person VR (F4) on native OpenXR. Needs D2R_DepthFog.fx (the new one) in ReShade. D2R VR Settings: UI: F4 body >
; Low life: red heartbeat vignette (all of these are sliders there). Live: no restart. 0 = exactly the picture as before
low_hp_vignette=0
; the life under which it comes on, % of the maximum life (10 - 60)
low_hp_threshold=30
; how red the edges are at the top of a beat when the life has just fallen under the threshold, and when it is nearly gone (0.05 - 1);
; in between it follows the life in a straight line, and so does the heartbeat in the controllers. (low_hp_strength of the first
; build, one number, is still read as low_hp_intensity_end when that key is not there.)
low_hp_intensity_start=0.25
low_hp_intensity_end=0.85
; the red's saturation: 0 a dark grey that only darkens the edges, 1 the full deep red (0 - 1)
low_hp_saturation=0.8
; how far in from the edge of the view the colour reaches, % of the view's ANGLE (20 - 95): small = a thin rim, large = a deep
; vignette; 100 minus it is the clear middle (40: the middle 60% stays clear - the middle 60 degrees of a 100 degree view). The plugin
; takes the real field of view of each eye from the headset's runtime, so the same value is the same angle on any headset (an old
; D2R_DepthFog.fx without it uses the picture's own proportions). 40 is about what the first build did
low_hp_radius=40
; how gradually the colour builds up over that reach: 1 a smooth fade all the way, 0 a short ramp and then flat to the rim (0 - 1)
low_hp_softness=0.8
; the shape of the clear middle: 2 an oval, higher a rounder rectangle (2 - 6)
low_hp_roundness=2.5
; 1 = gentle: slower (50 up to 72 beats a minute), a softer beat, a lower opacity, a slower fade
low_hp_gentle=0
; 1 = a short pulse in both controllers on each beat, as the red climbs, stronger the lower the life (needs [openxr] haptics=1; only
; while the tint is plainly there); and its scale, 0.1 - 2 (1 = about half the motor's strength at the lowest life, never over 0.8)
low_hp_haptics=0
low_hp_haptics_strength=1
; Life and mana on the wrists. First person (F4) only; it only READS the hero's life and mana, nothing in the game is changed.
; The way in is the toolbar's placement list: bar_place = 5 "Wrists: life left, mana right" (D2R VR Settings: UI: F4 body > Toolbar in the headset > Where).
; Then life is a ball on the back of the LEFT wrist and mana one on the RIGHT, like medallions (the game's own globes' places). FlatVR is given "not
; shown" for the toolbar in that case (the plugin draws the wrists itself). wrist_look picks what the balls are:
;   0 = real 3D glass with liquid (a medallion: a dome on a metal base - or the full ball, hand_vitals_orb_shape), drawn into the picture by D2R_DepthFog.fx with the game's
;       depth, per eye: a hand, a sleeve or a monster in front hides them; the liquid rises and falls with the numbers and slops gently, filling the way hand_vitals_orb_fill says;
;   1 = the game's OWN life and mana globes, cut out of its interface layer as it draws them (vr/hud_globes.h: their places come from the game's own HUD
;       layout and its Safe Screen Percent), with the real level of liquid, laid face-on on the same wrist balls. Not cut (and the log says why) where the
;       safe area does not hold the globes whole.
; Both need the new D2R_DepthFog.fx in ReShade, copied in with the DLL. Live: no restart.
wrist_look=0
; the shape: 0 a MEDALLION (a half ball of glass - the liquid in it - on a round metal base, flat on the back of the wrist, like the frame of the game's own globes;
; Size is its diameter, the base's; the game's own globes sit on the same base), 1 the full glass ball alone. Live
hand_vitals_orb_shape=0
; the medallion's base: the metal (0 gold, 1 bronze, 2 silver) and how aged it is, percent (0 clean metal; more: darker, green in the crevices and at the foot of the dome,
; bright where worn - fixed on the medallion, it does not swim as the hand moves). Live
hand_vitals_orb_metal=0
hand_vitals_orb_patina=55
; the glass look: which way the liquid fills. Each but the last is a FIXED DIRECTION OF THE WRIST's own frame (it turns with the wrist, never with the head): the level rises along
; it and the liquid sits on the other side. 0 along the arm, the elbow side full (a surface across the forearm, rising toward the hand); 1 along the arm the other way, the hand side
; full; 2 across the hand, the thumb side full; 3 across the hand, the little finger side full; 4 OUT OF THE HAND (the liquid lies on the skin and rises, its surface parallel to the
; back of the hand: level when the back of the hand is up - what a medallion's liquid looks like); 5 level in the world, whatever the hand does. Live
hand_vitals_orb_fill=4
; (The older hand_vitals_orb_liquid is still read where hand_vitals_orb_fill is not in the file: 0 is 0 and 1 is 5.)
; the game's own globes as a FULL BALL (hand_vitals_orb_shape=1): their disc 0 turns to face your eyes all the time (the first version), 1 stays FIXED ON THE WRIST - a disc lying on the
; back of the hand, its up along the hand - and turns with it. On the medallion it is always on the base. Live
hand_vitals_orb_disc=1
; The older keys still work without bar_place = 5: hand_vitals=1 shows the wrists the same way, hand_vitals_style picks the look: 0 the glass balls,
