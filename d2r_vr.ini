[weight]
; F4 with the arms on the controllers: a melee weapon held alone has weight (vr/weight.cpp). It lags
; behind a hard swing, a two-handed one wants both hands, a spear held by its end is slower than held
; where the game holds it. A hand holds it while its grip is squeezed, where the grip closed on the
; shaft; let a grip go and that hand lets go (the other keeps it). Both let go, it falls to the floor:
; take it up there, or squeeze the grip of the game's hand away from it to call it back into that fist.
; First person (F4) only, with BodyWalk's tracking or native OpenXR (with or without direct_input). The grips keep their
; other jobs: next to the belt a grip is a potion, behind a shoulder it is the weapon swap (that hand takes no weapon); hit by
; touch follows the weapon as drawn - the hand that carries it swings it, one let go (falling, lying) strikes nothing. With it
; on, [hands] staff_free_left and the other two-handed settings give way to it; off, they work as ever.
; A javelin or throwing weapon in the right hand follows the same rules; with the throw gesture's throw_by_grip a grip let go as a throw
; does not drop it (the game's own throw takes one out of the hand and a new one sits there).
; 0 = the weapon sits fast in the game's grip, as before.
on=0
; % of the weapon's real mass (a sword 1.2 kg, a two-handed sword 2.5, a polearm 3.5); 0 = none. 50 by default (half the real mass felt best in the headset); 100 = the real mass
feel=50
; % of the hands' strength (with gravity_feel it also stiffens the wrists; the force ceilings scale either way)
strength=100
; Gravity feel: the weight is gravity. The wrist is soft near the line of the controller and firm far off it, so a sword held out level sinks a few
; degrees, a polearm or a two-hander in one hand sinks a lot (two hands hold it much better), a swing down is helped by the weight and lifting up
; is slowed by it, and a hard cut is still followed. 0 = the old stiff wrists (the weight only shows as a lag); gravity_pct and damping_pct work either way.
gravity_feel=1
; % of the real g (9.81 m/s2) on the weapon's steel; 0 = no gravity, only inertia. (A weapon you let go always falls at the real g.)
gravity_pct=100
; % of the wrists' dampers (100 = nearly critical); the damper follows the controller's speed, it is not a drag
damping_pct=100
; how near the shaft (cm) the grip takes it
grab_cm=12
; a new weapon in the game's hand (its grip never squeezed yet), the other hand on it too: pulled this far (cm) away, it lets go
let_go_cm=25
; two hands on a long shaft (a staff, a spear, a polearm, a two-handed sword, axe or mace): the second hand slides along the shaft with its
; controller while its grip stays squeezed (the first hand holds where it took it); off an end, or pulled away, it lets go. 0 = it holds where it closed.
slide_second_hand=1
; 1 = the weapon's two attach bones (one on each wrist) are kept [hands] carry_cm apart along the weapon's own axis ([hands] carry_axis): the game lays a two-handed weapon along the
; line between them, and with both in ONE point that line has no length and the weapon is drawn squashed flat along its length (the staff as a dark disc, the grip and the red line
; right). 0 = both in one point (what 2c95c81 did).
attach_apart=1
; the closed fist's middle from the right controller, its own axes, cm (mirrored for the left)
fist_x=0
fist_y=0
fist_z=0
; Grip fit: a hand that TAKES the weapon (it closes its fist on the shaft: the second hand, a hand that takes it over from the other, the game's hand taking it
; up again) is laid on the shaft as it is drawn: the middle of its palm onto the shaft's axis (the red line, [debug] phantom_ray) at the place it took it, the line
; through its knuckles along the shaft (the roll about the shaft stays the controller's), the fingers closing with the grip's squeeze - also with [hands] fist off.
; fist_x/y/z above decide WHERE along the shaft the hand takes it. The hand the game holds the weapon in keeps the game's own pose; only its corrections below act.
; 0 = the hands are drawn at the controllers, as before.
grip_fit=1
; 1 = the taking hand sits on the shaft the way the game's own grip has the base hand: that hand's palm offset from the axis (across the hand and out of the palm) and
; the lean of its knuckle line are measured live (its own corrections below included) and given to the taking hand. 0 = the taking hand's palm exactly on the axis.
grip_fit_like_base=1
; 1 = the fingers and the thumb of a hand that TAKES the weapon have the game's own weapon-grip pose: the pose of the hand the game holds it in (wrapped round the shaft, the
; thumb on it) is read off the game's animation and put on the taking hand, mirrored as that hand needs (in the hand's own frame, whichever way the rig labels its bones). It is
; held as it is while the hand holds the weapon - not driven by the squeeze - and the fingers open as the hand lets go (or hands over); independent of [hands] fist. For a staff, a
; spear, a sword in two hands: whatever the game's hand does on that weapon. 0 = the fingers close with the squeeze (and with [hands] fist off, only that).
grip_fit_fingers=1
; Live corrections, PER HAND (right_grip_* / left_grip_*), whatever state the hand is in (the game's hand as placed, a hand that took the weapon, carrying it or not; one
; hand or two), in the SHAFT'S OWN FRAME at the place the hand holds it, turned as the hand holds it (so a fix found for one grip is right at any roll): x along the
; shaft (+ toward the tip), y across (+ toward the fingertips), z up (+ out of the palm), cm; rx the roll about the shaft, ry the tilt about the across axis, rz the
; tilt about the up axis, degrees. The same numbers on the two hands make mirror images. The weapon never moves with them, only the hand. All zero = no change.
right_grip_x=0
right_grip_y=0
right_grip_z=0
right_grip_rx=0
right_grip_ry=0
right_grip_rz=0
left_grip_x=0
left_grip_y=0
left_grip_z=0
left_grip_rx=0
left_grip_ry=0
left_grip_rz=0
; What becomes of a weapon let go, once it has landed (with [weight] on): 0 = it lies on the floor where it fell, as before;
; 1 = after to_back_delay_ms it disappears from the floor and hangs on the hero's back; 2 = after the delay it is not drawn at all.
; Only its drawing moves: the game's weapon is still his equipped one. On the back a long weapon (a staff, a spear, a polearm, a
; javelin, anything two-handed) lies diagonally across it, tip over the right shoulder; a short one lies across the lower back;
; it follows his body (turn, lean, crouch). Taking it back, in 1 and 2: a hand reached behind either shoulder with its grip
; squeezed takes it into that hand (the grip behind the shoulder is the weapon swap only while nothing is away); with
; recall_any_hand the grip of any free hand, anywhere else, calls it too (off: only the hand the game holds it in does).
; A weapon that is away strikes nothing.
after_drop=1
; ms a landed weapon lies on the floor before it goes away (0 = at once); for after_drop 1 and 2
to_back_delay_ms=600
recall_any_hand=1
; a hand whose fist is within this many cm of the weapon where it hangs on the back (anywhere along it) takes it with the grip, also outside the
; shoulder zone (the weapon hangs low across the back); 0 = the shoulder zone alone. The tick below fires in this zone too.
back_take_cm=25
; a short pulse in a controller when its hand reaches behind a shoulder while a weapon is away (needs [openxr] haptics); the strength in %
take_haptic=1
take_haptic_pct=40
; a THROWN weapon (a javelin, a throwing weapon released as a throw with [hands] throw_by_grip): its model leaves the hand at the release and falls like
; any weapon let go, but it does not lie on the floor or go to the back (after_drop). The game throws a missile of its own, and a model flying on beside it
; would be a second weapon: thrown_model 0 (the default) = the model is gone the moment the game takes the throw (the hero goes into its throw/attack
; animation), a fresh one stands in the hand; 1 = it flies on physically until it lands, the game's animation is over, or thrown_fly_ms. If the game does
; NOT take the throw (refused), the model's own flight is all there is, and it ends either way when it lands or after thrown_fly_ms from the release.
thrown_model=0
; 1 = a thrown POTION's model is not handed over to the game's missile when the game takes the throw (thrown_model / thrown_handoff_ms are for javelins, knives, axes): it flies the
;     whole thrown trajectory and breaks at its landing (it is gone, the next potion is in the hand), or after thrown_fly_ms. It is the potion that is seen - the game's own one is
;     hidden by [hands] potion_hide_game. 0 = a potion's model goes the way a javelin's does (gone the moment the game takes the throw)
potion_model_flies=1
; with thrown_model 0: a throw's model first FLIES OUT of the hand along the throw (the weight model's flight), then hands over to the game's own missile and
; vanishes: when the game's missile is up (its animation's action frame, where known) or thrown_handoff_ms after the release, whichever comes first
; (0, the default = vanish the moment the game takes the throw, no flight to see: only the game's own missile flies, never two weapons in the air)
thrown_handoff_ms=0
; with thrown_model 0: the hand stays EMPTY (the weapon not drawn) from the moment the game takes a throw until the hero's throw animation is over (plus
; a moment), then the game's own next one is in the hand; this is the longest it may stay empty (ms, 0 = not hidden at all: a fresh one is drawn at once)
thrown_hand_empty_ms=900
thrown_fly_ms=3000
; how far a throw goes (the weight model works the throw out: the weapon's peak velocity of the last 0.15 s before the release, as the hand really moved
; it, flown over the real ground; a heavy weapon leaves slower than a light one). A real arm throws a few metres; the horizontal part of the velocity is
; scaled by throw_reach_pct % (the fall stays real) and the landing held to throw_max_cells cells from the hero (the game refuses > 50 cells on an axis;
; a cell is two world units). The javelin tab's throws land where the weight model says, with [weight] on.
throw_reach_pct=800
throw_max_cells=48
; where it hangs (after_drop 1), on top of the default place, in the hero's back's axes: x right, y up, z away from the back (cm);
; pitch about x, yaw about y, roll about the shaft (deg). One set for long weapons, one for short.
back_long_x=0
back_long_y=0
back_long_z=0
back_long_pitch=0
back_long_yaw=0
back_long_roll=0
back_short_x=0
back_short_y=0
back_short_z=0
back_short_pitch=0
back_short_yaw=0
back_short_roll=0

[bow]
; attack along the hand when A is pressed: 0 off; 1 left stick while A is held (the game ignores it);
; 2 = A becomes Shift + left click along the hand's ray (works, but flips the game's UI to mouse);
; 3 = the stick turns the hero to the hand for turn_ms first, then A goes through (pad only);
; 4 = while A is held, the game's own attack vector points along the hand - turn the hand while firing
mode=4
; mode 3: how long the hero is turned before the attack, ms (more if he does not turn in time)
turn_ms=80
; mode 4 with a bow: the attack point this many grid cells out along the hand (more = finer aim), 3..40. The game refuses a
; point more than 50 cells from the hero on either axis, so 40 is the end (xbow_range_one/two, staff_range_one/two: 2..40 too)
range=30
; degrees the aim along the hand is turned about the vertical, if the shots land beside where the hand points: + = right, - = left
aim_yaw=-22
; the same for a staff (in place of aim_yaw while one is held), -45..45
staff_aim_yaw=0
; 1 = a bow or crossbow is always aimed with the left hand, whatever the weapon set
ranged_left=1
; 1 = with a staff (both controllers), spells and attacks go from the left hand to the right one
staff_two_hands=0
; the aiming hand of each weapon set (swap I / II in the game): 1 = left, 0 = right
set1_left=0
set2_left=1
xbow_aim_yaw=0
; 1 = the bow's own string, limbs and arrow follow the drawing hand: with the first-person arms on the controllers and
;     a bow in hand, while the draw gesture (the string hand pulled back) is on, the game's own bow bones are posed
;     from the hands - the string at the hand, the limbs folded to it, the arrow on the string, snapping back at the
;     release. Any bow a hero holds (15 models, recognised by its bones; a rig it does not know keeps the game's
;     animation). No bow is drawn over the game's: it is the game's own bow, its bones moved. 0 = the game's own
;     animation, as before. Needs the draw gesture. F4 only
rig_pose=0
; 1 = while the string is taken (the draw gesture), the bow, its arrow and the bow hand are turned until the bow points along the
;     line from the string hand through the bow hand - the line the shot goes along - as a real bow does, instead of sitting in
;     the hand turned the way the controller is; the hand and the forearm turn with it, the palm stays at the controller. 0 = the
;     bow is turned like the controller, as before. F4 only; live
aim_along_hands=0
; how long the bow takes to swing onto the line when the string is taken, and back when it is let go or the pull is cancelled,
; ms (50-400)
aim_blend_ms=120
; the bow's roll about its own axis while it lies along the hands: 0 = the roll the bow controller has, 1 = the limbs kept as
; upright as the aim lets them be
aim_roll=0
; with rig_pose: where the nocked arrow passes the bow hand is a point FIXED in the hand's own frame - this far from the hand's reference
; point, cm (-10..10): X along the bow (+ toward the target), Y across it (+ toward the archer's left, the bow arm's side, for a bow held
; upright), Z up the limbs (+ toward the upper limb, off the hand). The arrow, and the bow lying along the hands (aim_along_hands), lie on the
; line from the string hand THROUGH that point, which no longer slides about with the hands' places. All three 0 = through the reference point
; itself, as it was. It comes in and goes out with the draw over aim_blend_ms. [debug] bow_vectors draws it as an orange dot. F4 only; live
arrow_rest_x_cm=0
arrow_rest_y_cm=0
; (Z began as arrow_lift_cm, 0-8, 2.5: when this key is not here that old key is read as its default if it was set to something else than 2.5,
;  so nothing set is lost; else Z starts at 5 cm, about the top of the fist)
arrow_rest_z_cm=5
; 1 = where the arrow's line would still pass through the bow hand, the wrist or the forearm (the string hand low or far to a side, the hand
;     turned out) the arrow, and the nock with it, is lifted off the arm up the bow's limbs, by as little as clears it and at most 8 cm, parallel to
;     the line (the aim is not changed). 0 = the point exactly as the three offsets put it. Needs an offset above that is not 0
arrow_rest_clear=1
; 1 = the shot's aim is the line through that rest point too (the line the arrow lies on, so the shot goes where the arrow points);
; 0 = the shot as before, through the bow hand's reference point. Only matters while an offset above is not 0
arrow_rest_aims=1
; 1 = the hand that takes a bow's string is relaxed (the fist's open amount, [fist] open_*) and its fingers close on the
;     string - the thumb loose: they follow the controller's trigger and grip, and the moment the string is taken (bow_draw)
;     they are hooked whatever the controls read; let go, they open. Without the draw gesture they close with the grip.
;     Instead of the game's own animation of that hand; the bow hand keeps the game's. 0 = the game's animation, as before
hand_pose=0
; how far the fingers close on the string with hand_pose, % (100 = a full fist's bend). 85 since 2026-10-14 (was 70: too little to see)
hook_close=85
; 1 = (with hand_pose) the moment the string is taken the string hand takes the pose of the game's OWN bow-draw animation - the fingers hooked on
;     the string (the knuckles open, the last two joints of each finger curled), the thumb turned in - held as it is whatever the controller's grip
;     and trigger read, and let go on the release; the Amazon's right hand (the rig the pose was measured on), any other keeps hook_close.
;     0 = the fist table's hook (hook_close), which looked like a fist
hook_game_pose=1
; the game's draw pose as it is looked at (live): how far the four fingers bend, % of the game's own pose (100 = exactly as measured, 0 = the open hand,
; up to 150), and the thumb's base turned further in toward the palm (+) or out (-) than the game has it, degrees (-60..60, 0 = as the game)
hook_curl_pct=100
hook_thumb_deg=0
; 1 = (with hand_pose and hook_game_pose) the bow's string is held at the first joints of the hooked index, middle and ring fingers - where the game's draw
;     animation has them - not at the controller's grip point in the middle of the palm, about a hand's length behind them: the string passed beside the hand
;     and hooked nothing (2026-10-14). The arrow's nock and line and the bow's turn along the hands start from there; it comes in and goes out with the draw
;     (aim_blend_ms). The Amazon's right hand only. 0 = the grip point, as before. F4 only. Live
string_anchor=1
; that point moved, cm (-15..15): along the fingers (+ toward the tips), across the hand (+ toward the thumb side, the same on both hands), out of the
; palm (+ into the crook of the curled fingers, - toward the back of the hand; 0.8 = on the finger's inner side, not through the bone)
string_anchor_along_cm=0
string_anchor_across_cm=0
string_anchor_palm_cm=0.8
; 1 = A CHANGE OF THE GAME'S TIMING. The game makes a bow's arrow at one frame of its attack animation (an Amazon's: frame 6 of 14 = 0.24 s after the
;     animation starts, ~0.3 s after the release); the frame is the action flag of the hero class's bow attack row in the game's AnimData table. On: that flag
;     is moved to quick_release_frame, so the arrow is created ~0.2 s earlier INSIDE THE SAME ATTACK. The animation's length and the attack rate stay (the next
;     attack cannot start earlier); the damage, mana and arrows are the game's but happen earlier; a monster's hit in those first ~0.2 s no longer cancels the
;     shot. Only in VR first person (F4) with a bow in hand, and only offline (the game's own tables in this process); put back exactly when this is off, the
;     weapon, class or view changes, or the plugin unloads. The log tells what was found and moved ("bow quick release: ..."); a row that is not what was read
;     is left alone. [debug] bow_latency shows the arrow's create time. 0 = as the game has it. Live
quick_release=0
; the frame the arrow is made at with quick_release (a frame = 0.04 s): 1..12, 2 = as soon as the draw starts; at or past the original (6 for an Amazon) = no change
quick_release_frame=2

[render]
; room rings drawn around the hero, 1-8; with fog 4-6 is enough
rings=2
; rooms built per pass at most
build_rate=16
; houses, props and units are drawn out to this many world units (the game: 150)
model_radius=200
; the game's memory pools, MB: made at least this big once the game has made them (its own: 12 / 70).
; More rings and a larger model_radius need more - with its own 12 the game crashed in the Act 3 jungle.
; At or below the game's own (or 0): left as they are. Read at start; the log says what was done
render_pool_mb=64
entity_pool_mb=280
; 1 = keep the game's own height fog. Only the act 2 town has it; from our camera its edge is a hard
; line across the picture with a pale veil above (the game's camera never sees it). 0 = vrcam sets it to 0
game_height_fog=0
; 1 = keep the game's own depth fog. Every outdoor area has it, from a plane at its camera's distance from the
; ground: what lies farther than the middle of the picture is fogged - a grey haze in the four corners of the
; square window (from above too), over the near ground from ours. 0 = vrcam sets it to 0
game_depth_fog=0
; 1 = the game's linear depth (its fog, height fog, ambient occlusion, reflections, water) measured from our camera,
; 0 to depth_range world units. The game sets it for its own camera from above (550 to 1060): from ours every
; pixel was nearer, all of it read as one plane 550 away - the act 2 town's straight line with a pale veil above,
; the depth fog's haze in the corners. 0 = the game's own (the old picture)
depth_fix=1
; how far that depth reaches, world units (the hero is ~7.5 tall): farther counts as sky to the game's fog
depth_range=1000
; walls in front of the hero: 0 see-through as the game draws them, 1 solid but in F1 (from above
; they stay see-through, the hero in sight), 2 solid in every view
solid_walls=1
; 1 = the fog, the sky and the ceiling read the scene's own depth, picked by vrcam (the depth buffer the window's size
; the game uses most), never ReShade's pick (with a big square window it took the game's shadow map); 0 = no depth (tests)
own_depth=1
; 1 = the game's light culling right at a square or wide window (VR only). The game cuts the picture into 32 x 20 tiles
; and finds each one's depth range for its lights with a compute shader that takes a tile's row from its height - right
; only at 16:10, where tiles are square. At a square window lights vanish in hard rectangles and a roof's shading
; flickers as the head moves. 1 = a shader of our own, the same at 16:10, right at any size, bound in its place; it is
; made at the game's start (ticking this on later needs a restart; off works at once). 0 = the game's own
light_bounds_fix=1
; native OpenXR only (D2R VR Settings > Home > In the headset: the slider "Resolution (VR render size)" and the box "Use the
; headset's recommended size"): the size of the game's picture in the headset, apart from the size of its window.
; The game is told its size through its own window message (WM_SIZE) while the window keeps the size it has, once the hero has
; stood in a world 3 s; ReShade then builds the effects again (a pause of a few seconds). The cursor the game reads is
; mapped between the window and its picture; this plugin's own laser and mouse look keep the window's pixels.
; A change counts once it has stayed 0.7 s (dragging the slider asks the game once, after the drag). Live. Kept in every view.
; vr_resolution_px = the SQUARE's side in pixels, 1024 - 4096 (the slider's steps are 64), shrunk to what the runtime holds (never
;   under 640 x 480). 0 = not used: vr_resolution below says. A size the runtime refuses falls back to the last one it took.
; vr_resolution = the older mode: 0 Desktop, the window's size, as before (a bad number too)   1 Headset: the runtime's
;   recommendation per eye, its own shape (the settings' box; it wins over vr_resolution_px)   2..6 a square of 1536 / 2048 /
;   2560 / 3072 / 4096 (older inis; used only while vr_resolution_px is 0)
; Desktop (px 0 and mode 0), the session ending and the game closing give the window's size back; the headset away 30 s too.
; With a size picked, [openxr] square_window is not needed (skipped). What the runtime recommends and holds is written by the game
; to d2r_vr_headset.ini beside this file (when a session starts) for the settings' tip.
vr_resolution_px=0
vr_resolution=0

[third]
; F12 a second time: the third-person view, the camera this far back from the eye point (world units)
