[belt]
; 1 = NEAREST WINS between a belt potion and the weapon. A grip press that could take either goes to the nearer one: the palm's distance to the bottle against the fist's distance
;     to the weapon (the shaft of a weapon the other hand holds or that lies - within [weight] grab_cm; the weapon stowed on the back - within back_take_cm; a weapon away that this
;     grip would call back counts by its distance too, so a hand at the belt takes the potion); a tie goes to the weapon; a hand behind a shoulder is the weapon swap's. The potion is
;     lit (a ball) and taken only when it is the nearer one, and then the hand takes no weapon with that grip; where the weapon is nearer no ball is lit and the weapon takes the grip.
;     Every grip press says in the log who took it and why ("grip press - the left hand: WEAPON - ..."). 0 = as before: a potion in reach (12 cm of the palm) wins and the weapon is
;     not taken by that grip. F4 only, with belt_models. Live
grab_nearest=1
; 1 = a belt potion needs the TRIGGER squeezed with the grip (trigger + grip): the grip alone never takes one - it goes to the weapon (or the swap), and a bottle in reach is lit
;     but does not hold the grip from the weapon. Needs the controller's trigger from direct input ([openxr] direct_input); without it the grip alone takes, as before. 0 = the grip alone
;     takes a potion. Live. The headset settings' Belt page has this tick ("Take a belt potion with")
grab_trigger=0
; 1 = while a belt bottle is in a hand (taken, or being drunk) the TRIGGERS are the belt's: the LEFT trigger is taken from the layout whichever hand holds the bottle - the game reads it as
;     Shift on a belt key, and Shift + a belt key is not a drink (trigger + grip took the bottle and nothing was drunk) - and a right hand's own trigger too (no attack out of a drink).
;     A trigger taken stays the belt's until you let it go. 0 = the triggers pass on as before. F4 only, with belt_models. Live
hold_takes_trigger=1
