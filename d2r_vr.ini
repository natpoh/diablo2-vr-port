[onboarding]
; The FIRST-START GUIDE in the headset (vr/first_start.h; D2R VR Settings > Body > "First-start guide (in the headset)"). The first time you stand
; in the world in VR first person (F4) with native OpenXR and the plugin's own controls ([openxr] direct_input=1, [turn] right_stick=1), a panel in
; front of you offers the T-pose measurement above (when none is stored: right stick UP measures, DOWN goes on), then five short pages of what to
; press to open what - the inventory, the map, the skill panel, the belt, the settings in the headset, the pause menu, the F views. Right stick
; UP: the next page (on the last: closed), DOWN: back, held UP a second: closed. It reads only the right stick's up and down (nothing in the world
; uses them: the game never gets the right stick, the turn is its left / right); it presses nothing and takes no control, and the game runs on
; behind it. Hidden while a menu, the skill panel, the settings panel or the measurement is up, and in the other views. The idea of offering the
; measurement at the first start is bearstonem/d2r-pcvr's (MIT). Live.
; show: 1 = it comes up by itself while it is not done; 0 = never by itself (the headset settings' Body page "First-start guide" opens it either way)
