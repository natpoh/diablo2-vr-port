javelin_quiver_reach=1
; 1 = A CHANGE OF THE GAME'S TIMING. The game makes a throw's missile (a potion, a javelin, a knife, an axe) at one frame of its throw animation - the action flag of
;     the hero class's throw rows (<class>TH<weapon class>) in its AnimData table (an Amazon's: frame 9 of 16 = 0.36 s after the animation starts), so after your own
;     wind-up swing the hero winds up again before it flies. On: those flags are moved to quick_throw_frame, so the missile is created ~0.3 s earlier INSIDE THE
;     SAME THROW. The animation's length and the attack rate stay; the stack, mana and damage are the game's but happen earlier; a monster's hit in those first
