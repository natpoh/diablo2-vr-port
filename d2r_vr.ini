;  so nothing set is lost; else Z starts at 5 cm, about the top of the fist)
arrow_rest_z_cm=2.5
; 1 = where the arrow's line would still pass through the bow hand, the wrist or the forearm (the string hand low or far to a side, the hand
;     turned out) the arrow, and the nock with it, is lifted off the arm up the bow's limbs, by as little as clears it and at most 8 cm, parallel to
;     the line (the aim is not changed). 0 = the point exactly as the three offsets put it. Needs an offset above that is not 0
arrow_rest_clear=1
; 1 = the shot's aim is the line through that rest point too (the line the arrow lies on, so the shot goes where the arrow points);
; 0 = the shot as before, through the bow hand's reference point. Only matters while an offset above is not 0
arrow_rest_aims=1
; 1 = the hand that takes a bow's string is relaxed (the fist's open amount, [fist] open_*) and its fingers close on the
;     string - the thumb loose: they follow the controller's trigger and grip, and the moment the string is taken (bow_draw)
;     they are hooked whatever the controls read; let go, they open. Without the draw gesture they close with the grip.
;     Instead of the game's own animation of that hand; the bow hand keeps the game's. 0 = the game's animation, as before
hand_pose=1
; how far the fingers close on the string with hand_pose, % (100 = a full fist's bend). 85 since 2026-10-14 (was 70: too little to see)
hook_close=85
; 1 = (with hand_pose) the moment the string is taken the string hand takes the pose of the game's OWN bow-draw animation - the fingers hooked on
;     the string (the knuckles open, the last two joints of each finger curled), the thumb turned in - held as it is whatever the controller's grip
;     and trigger read, and let go on the release; the Amazon's right hand (the rig the pose was measured on), any other keeps hook_close.
;     0 = the fist table's hook (hook_close), which looked like a fist
hook_game_pose=1
; the game's draw pose as it is looked at (live): how far the four fingers bend, % of the game's own pose (100 = exactly as measured, 0 = the open hand,
; up to 150), and the thumb's base turned further in toward the palm (+) or out (-) than the game has it, degrees (-60..60, 0 = as the game)
hook_curl_pct=95
hook_thumb_deg=10
; 1 = the bow's string is held at the first joints of the index, middle and ring fingers - not at the controller's grip point in the middle of the palm, about a hand's
;     length behind them: the string then met the base of the hand and hooked nothing (2026-10-14). With hand_pose + hook_game_pose the joints are those of the hooked pose
;     (the game's draw animation; the Amazon's right hand); with hand_pose=0 they are those of the fingers as the game animates them (any hand). The arrow's nock and line
;     and the bow's turn along the hands start from there; it comes in and goes out with the draw (aim_blend_ms). The log says "bow string anchor: ..." with the bones. 0 = the
;     grip point, as before. F4 only. Live
string_anchor=1
; that point moved, cm (-15..15): along the fingers (+ toward the tips), across the hand (+ toward the thumb side, the same on both hands), out of the
; palm (+ into the crook of the curled fingers, - toward the back of the hand; 0.8 = on the finger's inner side, not through the bone)
string_anchor_along_cm=-2
string_anchor_across_cm=-2.5
string_anchor_palm_cm=2.5
; 1 = A CHANGE OF THE GAME'S TIMING. The game makes a bow's arrow at one frame of its attack animation (an Amazon's: frame 6 of 14 = 0.24 s after the
;     animation starts, ~0.3 s after the release); the frame is the action flag of the hero class's bow attack row in the game's AnimData table. On: that flag
;     is moved to quick_release_frame, so the arrow is created ~0.2 s earlier INSIDE THE SAME ATTACK. The animation's length and the attack rate stay (the next
;     attack cannot start earlier); the damage, mana and arrows are the game's but happen earlier; a monster's hit in those first ~0.2 s no longer cancels the
;     shot. Only in VR first person (F4) with a bow in hand, and only offline (the game's own tables in this process); put back exactly when this is off, the
;     weapon, class or view changes, or the plugin unloads. The log tells what was found and moved ("bow quick release: ..."); a row that is not what was read
;     is left alone. [debug] bow_latency shows the arrow's create time. 0 = as the game has it. Live
quick_release=1
; the frame the arrow is made at with quick_release (a frame = 0.04 s): 1..12, 2 = as soon as the draw starts; at or past the original (6 for an Amazon) = no change
quick_release_frame=1
; 1 = QUIVER (a bow). The skill the next shot fires is picked from the quiver, without the skill panel: Magic / Fire / Cold / Exploding / Ice / Guided /
;     Freezing / Immolation Arrow, Multiple Shot, Strafe - only the ones the hero has learned (points or items; none: a short buzz and nothing else), plus what the slot
;     held before (the plain attack, usually) so that the cycle comes back to it. It is the game's own skill setter, the one the skill wheel and the tiles use, on the slot
;     the shot presses (a bow's release: bow_draw_button, the attack = the A slot): the same as picking the skill in the panel - no server
;     call. The shot is what it was: the game's own attack does the rest (mana, arrows, attack rate). The arrow in the bow glows in the
;     skill's colour while the string is drawn and the controller ticks at each change. With the string draw: a button of the string hand while the string is drawn (quiver_next / quiver_prev in
;     [direct]; B = next, A = previous), or the orbs below. The idea is bearstonem/d2r-pcvr's (MIT, v0.3.17, aSuperGod). Needs the controller layout. F4 only. 0 = as it was. Live
;     (The reach behind a shoulder, quiver_reach, is gone - the shoulders are the shoulder swap's; an old quiver_reach line in an ini is not read and does no harm.)
quiver=1
; 1 = (with quiver, a bow) ENERGY ORBS along the bow's stave, one for the plain shot and one for every bow skill the hero has learned, each in its skill's colour; the skill the next shot
;     fires is the bigger, brighter one. The free hand at an orb with its TRIGGER (quiver_orb_trigger) picks that skill - the same request as the quiver's other ways (the game's own skill setter, never a
;     direct cast). At an orb the trigger is the orb's (no shot, no draw) and the grip does nothing; anywhere else the trigger and the string are as always. The orbs sit on the bow's own stave (read off its bones)
;     and follow the bow; they NEVER go: at rest, while the string is drawn, at the release, in a menu - only no bow in hand, another view, this tick off or an unread stave take them (nothing is taken
;     from an orb then: no pick while the string is drawn, in a menu, nor for 0.6 s after a draw). Needs the effect D2R_DepthFog.fx of this version. 0 = no orbs. F4 only. Live
quiver_orbs=1
; 1 = the free hand's TRIGGER picks an orb (the default); 0 = the grip picks, as the orbs first did. A trigger that took an orb stays the orb's until let go (the hand leaving the orb with it
;     down does not start the game's attack). Live
quiver_orb_trigger=1
; 1 = (with quiver, a bow) an arrow skill that is chosen (an orb, a button, the skill panel) but cannot be paid - too little mana - is shot as the PLAIN ARROW at the release, instead of the
;     game's refusal ("not enough mana", nothing shot); the skill stays chosen, so with the mana back the next release is the skill again. Whether the hero can pay is the game's own arithmetic
;     on the game's own numbers: the skill's row in Skills.txt (mana, lvlmana, manashift, minmana) at its level (points and items) against the hero's mana, less what our last cast took if
;     the mana read (five a second) has not caught up; a skill the plugin has no row for is left to the game. The plain attack goes the game's way: its own attack button, the cast reading the
;     slot as Attack (the javelin quiver's mechanism, vrcam.cpp HookSlotSkill) - nothing is called on the server. The log says "not enough mana for ... this release is the plain attack".
;     0 = the game's refusal, as it is. F4 only. Live
quiver_plain_no_mana=1
; 1 = (with arrow_fx) the arrow's effect goes OUT while the hero cannot pay the chosen arrow skill - the release is then the plain attack (quiver_plain_no_mana) or the game's refusal, so the arrow
;     looks plain (the coloured glow too) - and lights again when the mana is back. The same game numbers as the release's (the skill's Skills.txt row, its level, the hero's mana less our last
;     cast), at rest as much as while the string is drawn; believed after 0.3 s and eased over 0.2 s, so it does not flicker at the edge. 0 = the effect stays whatever the mana. F4 only. Live
arrow_fx_needs_mana=1
; the orbs' look and place, live (cm): the radius of an orb; the grab radius round its middle (the hand's grip point has to be this near for the orb to be the one the hand is at - bigger
; than the orb on purpose); where the first orb hangs on the stave, from the grip; the distance between orbs; and the shift of the whole row along the bow's own axes - x across the bow
; (+ to the right of an upright bow), y along the stave (+ toward the limb that points up), z toward the archer. The stave is read off the bow's bones: the limb that points UP of the two
quiver_orb_size_cm=2.6
quiver_orb_reach_cm=10
quiver_orb_start_cm=20
quiver_orb_spacing_cm=9.5
quiver_orb_x_cm=-2.5
quiver_orb_y_cm=0
quiver_orb_z_cm=-4
; the row's turn about the same three axes (degrees, right-hand rule), on its first orb - where the shifts above put it: x tilts the far end of the row toward you (+) or away (-), z leans
; it to the left (+) or right (-) of an upright bow, y swings a row that is tilted round the stave (alone it moves nothing: the row lies along that axis). Applied in the order x, y, z,
; about the bow's own axes, so it follows the bow. -180..180. 0 = the row lies along the stave
quiver_orb_rot_x_deg=-15
quiver_orb_rot_y_deg=0
quiver_orb_rot_z_deg=0
; 1 = (with quiver, a bow) the arrow burns, freezes or crackles by the skill that is chosen - from the moment it is chosen (an orb, a button, the game's own slot), nocked at rest, and through the
;     draw; the plain shot has none: flames and rising embers for Fire / Exploding / Immolation Arrow,
;     frost, ice crystals, glints and a falling mist for Cold / Ice / Freezing Arrow, an arcane glow with sparks circling the shaft for Magic Arrow. Light the effect draws in the picture
;     (D2R_DepthFog.fx of this version; nothing of the game's is created): hidden by what is nearer than the arrow, a hand or a sleeve. A skill with no element of its own - the plain shot,
;     Guided Arrow, Multiple Shot, Strafe - keeps the small coloured glow (while the string is drawn), and with this off every skill does. A few hundredths of a millisecond per eye on a fast card.
;     The idea is bearstonem/d2r-pcvr's quiver preview (MIT). F4 only. Live
arrow_fx=1
; the effect's size and brightness in percent (100 = a flame 4.5 cm round the arrow's head); 30-300 and 20-300
arrow_fx_size_pct=100
arrow_fx_bright_pct=100
; the effect's centre moved along the arrow's shaft, cm (-20 - 60): more is forward, toward the arrowhead; 0 = where it is found. Live
arrow_fx_along_cm=60
xbow_two_hands=1
xbow_range_two=30

[render]
; 1 = on a Ryzen X3D with two core groups the game's threads prefer the cores with the big L3 cache, its draw thread a higher priority
vcache=0
; 1 = the effects' values (fog, sky, ceiling) kept apart between eyes and frames by fences: the next pass waits for the
; GPU to have drawn the last one's effects (FlatVR's frame stamps with one picture a frame). F4 only. 0 = no wait
fx_fence=0
; room rings drawn around the hero, 1-8; with fog 4-6 is enough
rings=2
; rooms built per pass at most - NOT READ by this version (a key of the old renderdistance plugin; vrcam takes rings and model_radius only)
build_rate=16
; houses, props and units are drawn out to this many world units (the game: 150)
model_radius=200
; the game's memory pools, MB: made at least this big once the game has made them (its own: 12 / 70).
; More rings and a larger model_radius need more - with its own 12 the game crashed in the Act 3 jungle.
; At or below the game's own (or 0): left as they are. Read at start; the log says what was done
render_pool_mb=64
entity_pool_mb=280
; 1 = keep the game's own height fog. Only the act 2 town has it; from our camera its edge is a hard
; line across the picture with a pale veil above (the game's camera never sees it). 0 = vrcam sets it to 0
game_height_fog=0
; 1 = keep the game's own depth fog. Every outdoor area has it, from a plane at its camera's distance from the
; ground: what lies farther than the middle of the picture is fogged - a grey haze in the four corners of the
; square window (from above too), over the near ground from ours. 0 = vrcam sets it to 0
game_depth_fog=0
; 1 = the game's linear depth (its fog, height fog, ambient occlusion, reflections, water) measured from our camera,
; 0 to depth_range world units. The game sets it for its own camera from above (550 to 1060): from ours every
; pixel was nearer, all of it read as one plane 550 away - the act 2 town's straight line with a pale veil above,
; the depth fog's haze in the corners. 0 = the game's own (the old picture). Read only while depth_fix_mode is not in the file: with it, depth_fix_mode decides (0 = off)
depth_fix=1
; with depth_fix=1, how: 1 = in each pass as it is bound (every b10 a root signature binds gets our range, as before); 2 = once a frame
;     where the game makes it (its frame-constant builder, 0xE3B590): every pass reads the same range, from our camera's near plane to the
;     game's own far end (depth_range not used) - after bearstonem/d2r-pcvr; 0 = off (the game's own, as depth_fix=0). Live
depth_fix_mode=1
; how far that depth reaches, world units (the hero is ~7.5 tall): farther counts as sky to the game's fog
depth_range=1000
; walls in front of the hero: 0 see-through as the game draws them, 1 solid but in F1 (from above
; they stay see-through, the hero in sight), 2 solid in every view
solid_walls=1
; VR F4: the roof of a building you walk into stays (the game takes it away for its camera high above,
; which from the eyes shows the sky through the ceiling). 1 = kept, 0 = the game's own. F1 - F3 keep the
; game's cut-aways. Idea: bearstonem/d2r-pcvr
keep_roofs=1
; VR: a roof's material is built double-sided, so under a kept roof its underside is drawn, not the sky (the roofs of
; roof models, by the name "roof"; nothing else). Takes effect when an area loads: the next area you go to (what is
; loaded keeps its sides until the game loads it again). 1 = two-sided, 0 = the game's own. From bearstonem/d2r-pcvr
roofs_two_sided=1
; 1 = the fog, the sky and the ceiling read the scene's own depth, picked by vrcam (the depth buffer the window's size
; the game uses most), never ReShade's pick (with a big square window it took the game's shadow map); 0 = no depth (tests)
own_depth=1
; 1 = the game's light culling right at a square or wide window. The game cuts the picture into 32 x 20 tiles
; and finds each one's depth range for its lights with a compute shader that takes a tile's row from its height - right
; only at 16:10, where tiles are square. At a square window (the VR window, a 1920x1920 flat one too) and at 16:9
; lights vanish in hard rectangles and a roof's shading flickers as the head moves. 1 = a shader of our own, the same at
; 16:10, right at any size, bound in its place; it is made at the game's start (ticking this on later needs a restart; off
; works at once). 0 = the game's own
light_bounds_fix=1
; 1 = that also in flat mode ([mode] platform=0: a monitor or a window, native OpenXR's flat picture too), live when the
; mode changes; 0 = in VR only. Needs light_bounds_fix. At 16:10 ours equals the game's bit for bit
light_bounds_flat=1
; native OpenXR only (D2R VR Settings > Home > In the headset: the slider "Resolution (VR render size)" and the box "Use the
; headset's recommended size"): the size of the game's picture in the headset, apart from the size of its window.
; The game is told its size through its own window message (WM_SIZE) while the window keeps the size it has, once the hero has
; stood in a world 3 s; ReShade then builds the effects again (a pause of a few seconds). The cursor the game reads is
; mapped between the window and its picture; this plugin's own laser and mouse look keep the window's pixels.
; A change counts once it has stayed 0.7 s (dragging the slider asks the game once, after the drag). Live. Kept in every view.
; vr_resolution_px = the SQUARE's side in pixels, 1024 - 4096 (the slider's steps are 64), shrunk to what the runtime holds (never
;   under 640 x 480). 0 = not used: vr_resolution below says. A size the runtime refuses falls back to the last one it took.
; vr_resolution = the older mode: 0 Desktop, the window's size, as before (a bad number too)   1 Headset: the runtime's
;   recommendation per eye, its own shape (the settings' box; it wins over vr_resolution_px)   2..6 a square of 1536 / 2048 /
;   2560 / 3072 / 4096 (older inis; used only while vr_resolution_px is 0)
; Desktop (px 0 and mode 0), the session ending and the game closing give the window's size back; the headset away 30 s too.
; With a size picked, [openxr] square_window is not needed (skipped). What the runtime recommends and holds is written by the game
; to d2r_vr_headset.ini beside this file (when a session starts) for the settings' tip.
vr_resolution_px=1536
vr_resolution=0
; 1 = with a render size in force (vr_resolution_px / vr_resolution) the game's own client-size query answers its interface and its
;     mouse clamp the whole picture, not the window: no menu edge lost on a window wider than the picture,
;     the bottom row of the main menu reachable on a window lower than it (vr/render_resolution.cpp, after bearstonem/d2r-pcvr). 0 = the
;     window's size, as before. Live
vr_resolution_ui=1
dlss_prev_fix=0
dlss_mv=2
dlss_mv_sign=-1
dlss_mv_lag=0
dlss_mv_far_turn=1
dlss_mv_near=0
dlss_mv_jitter=1
; NOT WORKING YET (0.170): in the build, off - Fade is set on the effect, nothing changes on screen (docs/KNOWN_ISSUES.md 25). 1 = the effects that sit ON the hero are faded in first person (F4) - Bone Armor wraps round the eyes of the first-person view and blinds. The overlays of the hero's own states
;     (Bone Armor, Frozen / Shiver / Chilling Armor, Energy Shield, Cyclone Armor, Blade Shield, Fade ... and the casting flash of each), by the game's own tables; the aura rings at his
;     feet are the second group. Visual only: the buff, its numbers and its timers are the game's and are not touched; monsters', mercenaries' and other players' effects, and every
;     overlay that is not a state's (hits, casts of skills), are drawn as ever. Holy Shield is not an overlay (a colour on the shield) and is not covered. Done with the effect's own
;     "Fade" parameter, the one the game fades an overlay with when its unit fades (the log says, per effect); 0 % hides the effect (the game's own visibility switch). OFF in the settings that come with the mod: in the build, but not working
;     yet - the log shows the Fade parameter set on the effect, yet nothing changes on screen (docs/KNOWN_ISSUES.md). An effect already on when this is ticked is faded when it is cast again. Live
dim_own_effects=0
; how much of the hero's own effects is left, % - the value the effect's Fade parameter gets (100 = as the game draws them, 0 = hidden)
dim_own_effects_pct=50
; the same for the aura rings at his feet, %
dim_own_auras_pct=60

[third]
; F12 a second time: the third-person view, the camera this far back from the eye point (world units)
distance=17
; and the eye point this high above the ground
height=11

[input]
