frame_log=0
; 1 = for a stutter that comes with a swing or a hit (vr/frame_trace.h): a pair - both eyes of one game frame - longer than frame_trace_ms is told in
;     the log, the worst one of each second: where its time went (the game's own frame, xrWaitFrame, the left and right pass, XR end, how much of it
;     the draw thread really worked against waited), what the PLUGIN spent in it (the pose hook - once per skeleton the game poses -, the hit observer,
;     the aim hooks, the server's unit lookups, the 100 ms probe job of hit by touch, the haptic call, the host's log lines; the log time inside a hook
;     is in both), the situation it fell in (idle / walking / a swing / a hit landed) and the access violations caught since the last pair. Every
;     10 s one line counts the pairs by situation and how many of each were long, and the plugin's mean cost a pair - send that log in. Only measures
;     and writes lines; a clock read or two in each hook while on, one relaxed load when off. Any view. Live. 0 = off
frame_trace=0
; the pair length, ms, above which frame_trace tells a pair (2 - 1000). 15 = a little over a frame at 72 Hz; at a steady 20 ms a pair (50 frames a
; second) raise it to 30 so only the real stutters are told
frame_trace_ms=15
; 1 = the plugin's log lines are written by a thread of their own (vr/log_queue.h): the thread that logs - the game's, in the middle of a frame - copies
;     the line into a ring and goes on, instead of waiting for the host's file write (about 1 ms a line on the machine this was found on, which writes
;     20 - 50 lines in a second of swinging: about seven from the pad poll at every press). Every line is kept, in order; a full ring is written by the
;     thread itself; a line that waited more than 50 ms says so at its end (the host stamps the time it WRITES the line); at a crash and at unload what
;     waits is written first. Live. 0 = each thread writes its own lines, as always
log_async=0
; 1 = log every controller press (the first 400 lines of a run; 2 = all of them), with where it came from; about 1 ms per line on the draw thread. 0 = off. Live
input_log=0
; 1 = the game's D3D12 device lost (the game ends with a failed HRESULT in its own DX12 backend and, a moment later, a null read; the headset's runtime logs
;     "HRESULT failure [887a0005]"): DRED - Device Removed Extended Data - is asked for before the game makes its device, so that when the device is removed the log
;     and d2rloader\logs\d2r_vr_gpu_fault.txt say why: the reason, what each command list had done when the GPU stopped, the address of a page fault and what was allocated or just freed
;     there, and the plugin's own last events that touch the GPU's memory. Cheap (the runtime writes a marker between commands); the report is written the moment the
;     device goes. Needs a game restart. 0 = DRED not asked for (the device loss is still told, with its reason only)
dred=1
; 1 = a GPU queue that stands still for good. Two hangs of 2026-10-18 left the game's direct queue standing - no device removal, the process alive,
;     the draw thread inside ReShade's flush (an infinite wait on a fence of a submission eight flushes old); all of the plugin's own fences were complete, and the
;     queue was not waiting on any fence but running a list that never ended. On: (1) the plugin's optional work that would wait on the queue (the copy to the headset
;     with ReShade's flush before it, an eye's ReShade effects, the right eye's depth copy, the effects' fence mark, the replacement of own depth's texture) is not
;     started while the queue has not moved for stall_skip_ms; (2) after stall_unstick_ms with the presents stopped and the queue still, the replay's watchdog signals the
;     plugin's own cross-queue fences from the CPU - every 5 s while it stands; each is a line in the log ("stall guard"). Needs a game restart.
;     0 = nothing of this: the old behaviour
stall_guard=1
; 1 = also (with stall_guard) the game's own fences that a queue waits for and nothing queued will reach, and the ones reached (to wake what did not hear), are
;     signalled from the CPU at that time. That tells the game a thing done that is not - for a hang that is a lost wake-up; no use against a list that never ends
stall_unstick_game=0
; 1 = (with stall_guard) the device is taken away ON PURPOSE after 20 s of presents stopped and a queue standing, so that DRED (see dred) writes which command list the
;     queue was in to d2rloader\logs\d2r_vr_gpu_fault.txt and the log; the game then ends as after a driver reset. For a test of the hang, not for play
stall_remove=0
; ms the direct queue must stand still, with the plugin's work on it, before the optional work above is skipped (a long loading frame is 0.3 - 3 s here)
stall_skip_ms=250
; ms the presents and the queue must stand still before the watchdog signals fences from the CPU
stall_unstick_ms=8000
; ms (0 = never) after which the device is taken away ON PURPOSE if the queue still stands, so that DRED (see dred) writes where each queue stood to
;     d2rloader\logs\d2r_vr_gpu_fault.txt and the log: the game then ends like after a driver reset. For a test of the hang, not for play. Try 20000
stall_remove_ms=0
