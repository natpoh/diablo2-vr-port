; d2r_vr.ini - put next to d2rl-vrcam.dll and d2rl-renderdistance.dll.
; vrcam re-reads [camera] [head] [stick] the moment you save this file (game running).
; [render] ; 1 = full frame rate while the game window is behind BodyWalk or the headset (the game sleeps 10 ms a frame there: ~60 fps)
background_full_speed=1
is read when the game starts.

[camera]
; 1 = the FOV follows the FlatVR screen (its size and distance in BodyWalk), like an OpenXR game's view
fov_from_flatvr=1
; vertical FOV of the game camera when fov_from_flatvr=0
fov=64
; camera behind the eye point; below 0 = in front of the face, 45 = upstream 3dcam view
distance=0
; eye point above the ground under the hero (world units)
height=6.3
; 1 = first person: the eyes at the hero's own height, from his rig (sorceress 5.3 .. druid 6.5 units); height is then unused
height_auto=1
; added to that height (world units, ~0.24 m each)
eye_offset=0
; 1 = the camera goes up when the animation lifts the hero (the barbarian's Leap); the held upper body goes with it
follow_jump=1
; hip rise (model units) still taken for the stride's bob, not a jump; above twice this the camera follows it whole
jump_from=0.3
; pitch on top of the game's own camera (deg), more negative = looks higher; -60 = horizon; BodyWalk sends no head pitch
pitch=-30
; nothing closer than this (world units, ~0.24 m each) is drawn: hides the hero's own head and hair
near=0
; eye point to the right (+) / left (-) of where you look, world units (~0.24 m each);
; the hero's head is off the model's centre line, so without it the eye can sit on a shoulder
side=0
; eye point ahead (+) / behind (-) along where you look, without tilting with the head
forward=0
; 1 = the head turns about the neck (below and behind the eyes), not about the eyes: looking down shows the chest
neck_model=1
; the eyes above and in front of that pivot, cm (scaled to the hero)
neck_up_cm=10
neck_forward_cm=9
shadow_slope=0.5

[head]
; 1 = the head goes on between BodyWalk's updates by its last speed; 0 = as sampled, and FlatVR places the screen
; at the head pose of the sample's own moment (smoother: no guessing in the picture)
predict=0
; 1 = camera yaw follows the headset (needs BodyWalk with its Game Link plugin)
yaw_from_head=1
; -1 if turning the head left turns the view right
yaw_sign=-1
yaw_scale=1
; 1 = camera pitch follows the headset too (BodyWalk with head pitch)
pitch_from_head=1
; -1 if looking up tilts the view down
pitch_sign=1
; 1 = tilting the head sideways rolls the camera too
roll_from_head=1
; -1 if tilting the head right tilts the picture the wrong way
roll_sign=1

[stick]
; 1 = exact: the stick goes through the real camera axes (sign/squash unused)
exact=0
; 1 = turn the left stick by the camera yaw, so forward is forward in the view
rotate=1
; -1 if after a head turn forward on the stick walks the wrong way
sign=-1
; <1 if diagonals drift after a turn (isometric screen squash); 1 = off
squash=1
; approximate mode: the stick turns by the camera yaw times this (0.5 = half)
angle_scale=1

[turn]
; 1 = right stick X turns the body (camera and walking); the game no longer gets the right stick
right_stick=1
; smooth turn speed at full deflection, deg/s
speed=120
; >0 = snap turn by this many degrees per flick (e.g. 30) instead of smooth
snap=0
; -1 if pushing right turns you left
sign=-1

[stereo]
; 1 = native stereo by alternate frames: the game draws left eye, right eye, left...
; needs the FlatVR addon in the game, FlatVR picture source = UEVR (full-size SBS),
; VSync off and a high frame cap (180 fps = 90 per eye)
afr=1
; 1 = both eyes from ONE game frame: the frame is drawn twice (left, then right with the game time held),
; instead of one eye per frame by turns. Same pairs per second; the game itself updates half as often
pair_per_tick=1
; with pair_per_tick: 1 = the frame is drawn ONCE and the right eye is drawn again on the GPU from the same
; work with its own camera (one CPU pass, two pictures - nearly the mono frame rate); 0 = two passes a frame.
; D2R VR Settings, Performance, "3D in the headset": Stereo (this on) / Stereo - eyes by turns (afr alone)
replay_right=1
; 2 = the CPU draws the next frame while the GPU still replays the last one (faster); 1 = it waits for it
replay_ahead=2
; ms of game time the right eye's pass gets instead of none: effects that skip a frame of no time
; (butterflies) are drawn in it then. 0.01 is enough; more moves the world between the eyes
right_dt_ms=0.01
; 1 = the game's own view from above (F12 off) in stereo too: each eye turned about the hero by half of top_angle
top_down=1
; degrees between the eyes from above; more = deeper
top_angle=3
; eye separation in world units (hero ~7.5 tall ~ 1.8 m, so 0.27 ~ 6.4 cm); more = stronger 3D
; 1 = the world 1:1: eye distance and zero-parallax plane from the FlatVR screen and your head height (ipd and convergence below are then ignored)
true_scale=1
; your own eye distance, millimetres
eye_mm=60
; your height, metres - the scale of the world and of the hands (eyes at 0.936 of it); seated, still your standing height
user_height_m=1.75
ipd=0.16
; 1 if the eyes come out swapped (depth looks inside out)
swap=0
; distance that sits on the FlatVR screen (world units, ~0.24 m each); farther goes deeper behind it.
; 0 = parallel eyes (everything in front of the screen). Smaller = deeper
convergence=0
; the HUD nearer than the FlatVR screen, AFR only: moved apart per eye by the shader, % of the half screen (0 = on the screen)
ui_near=0
; the HUD is looked for below this height, 0 = top of the screen, 1 = bottom
ui_top=0.7
; how many of an eye's views the presented frame lags the newest one (0-3): the frame stamp and the sky go
; that far back. 0 by default: with 1 (meant for the game's own pipelining) head turns lagged and the sky
; floated in mono and eyes by turns (2026-10-10); pairs from one game frame always use 0
pipeline_depth=0
source=2
headset_rate=3

[openxr]
; PROTOTYPE (docs/plan_native_openxr.md). 1 = the game shows itself in the headset through OpenXR from its
; first frame: first (F4) and third person (F2) in stereo with "Stereo - one pass, two pictures", F1 and F3 too (views_3d
; below), menus and panels as a flat picture; FlatVR is stopped while it does, BodyWalk's panels are not
; in the headset then. 0 = FlatVR as always. Switches live (the session starts at the next F4 frame).
on=0
; local (the head where it is at the start) or stage (the room's floor)
space=local
; 1 = each eye's view narrowed to the window's shape (black above and below): square pixels, all the
; window's lines on a smaller angle - sharper; 0 = the whole view, the window's pixels stretched over it
; (the picture itself is right either way)
fov_crop=1
; 1 = each eye drawn as wide to the left as to the right: the game's interface (labels over monsters and
; items) is the same in both eyes and meets; 0 = each eye's own fov (fewer pixels wasted, the labels apart)
symmetric_fov=1
; a runtime that locates both eyes at the same point (eyes 0 mm apart in the log: no stereo, a double image that never merges)
; gets this gap between them, in mm, about the middle of the head; 0 = take the runtime's eyes as they come. 40 - 80
ipd_fallback_mm=64
; first and third person: how far the head may lean away from the body, metres; walking farther in the room
; drags the body along (the camera stays in the hero). 0 = held to the body: turning only (with the neck model)
lean_m=0.1
; a controller that loses its place (out of the headset cameras' view: PS VR2, Quest) is held where it was by
; the head this long, ms, before the doll lets its arm go; 0 = let go at once
hand_hold_ms=1000
; 1 = FlatVR stopped through BodyWalk's Game Link before the session, started again after
stop_flatvr=1
; everything in the headset this much darker (< 1) or brighter (> 1): the runtime scales the colours
; (XR_KHR_composition_layer_color_scale_bias), 1 = as the game draws it; 0.2 - 2
brightness=1
; outside first person (menus, loading; F1 and F3 with views_3d=0): the window as a flat picture this far ahead and this wide, metres;
; a panel open in a game (inventory, trade...) at [screen] menu_distance_m instead. F1 in 3D is a window of this size and distance
flat_distance_m=2
flat_width_m=2.4
; 1 = F1 (from above) and F3 (the game on your floor) in real 3D with the headset's own eyes, like F4 and F2: F3 is the
; diorama standing on your floor or table (walk round it, lean over it; the room's own floor when the headset has one), F1 the
; game's view from above in true perspective seen through a window of flat_width_m at flat_distance_m with your hero on its middle
; (lean to see round things); F1 is in true perspective then whatever [top] perspective says. Menus, loading and the character screens stay the flat
; picture. 0 = F1 and F3 as the flat picture, as before. Live.
views_3d=1
; 1 = (needs views_3d=1) in F1 and F3 the game's own mouse pointer (the gauntlet, the sword over a monster...) is drawn on the game's ground where its mouse
; points - the ground point a click would walk to, a few centimetres large, turned to your eyes, its tip on the point; the flat picture shows it too, in 3D
; there is no picture to show it on. Only drawn: the mouse, the clicks and the hero's movement are not touched. Shown while the game shows its pointer and the
; mouse is over its window. 0 = no pointer in F1 and F3. Live.
pointer_3d=1
; PROTOTYPE (docs/plan_laser_menus.md). 1 = a controller pointing at the flat picture of the menus (the title and
; character screens, a panel open in a game - never F1 and F3) is the mouse: its trigger clicks, with its grip
; held it right-clicks, a held trigger drags; the other hand's trigger is Ctrl, its grip Shift. What the laser
; takes is not BodyWalk's while it points at the picture; a stick or a face button gives the panel back to the pad.
; The game is kept in its controller layout meanwhile. laser_hand: 0 left, 1 right
laser=0
laser_hand=1
; 1 = (needs laser=1) the game's own item tooltip under the laser shows at once instead of after its 1000 ms, with
; the equipped-item comparison beside it, no Shift held: the game's tooltip and comparison, only earlier (two of the
; game's own queries answered at their call sites while the laser points at the menu). 0 = the game's delay and Shift
; F4 ONLY (VR first person): in F1, F2, F3 the game's own delay and Shift, as before.
laser_tooltips=0
; PROTOTYPE (docs/direct_input.md). 1 = native OpenXR with the plugin's own controls: it reads both controllers
; itself and gives the game its gamepad, actions and key commands, so BodyWalk is not needed for them (its virtual
; pad, buttons, gestures and tracking are ignored meanwhile; FlatVR and BodyWalk go on for everything else).
; The layout is in [direct] below. 0 = BodyWalk's controls. Live, with a native session.
; F4 ONLY (VR first person): in F1, F2, F3 and the flat modes BodyWalk's controls are the controls, at once, as if this were 0.
direct_input=0
; 1 = (needs direct_input=1) BodyWalk's WALKING still walks the hero in direct mode: BodyWalk is given your head and hands (no button, no stick of the
; controllers: it presses nothing a second time) so it can walk by your body (steps in place, an arm swing, a lean), and ITS LEFT STICK - nothing else of its
; gamepad, actions or commands - is mixed into the controller's left stick: each counts past the game's dead zone, together they add up (never past a full stick),
; pulling apart the stronger one wins, the same push twice is not doubled. A panel or menu open: the controller's stick only. BodyWalk has to be running and write its
; gamepad (Input Source: Game Link). The log says "BodyWalk's walk - COMBINED / IGNORED / DROPPED" and why. 0 = BodyWalk's walking is ignored in direct mode, as it
; was, and BodyWalk is given no headset. F4 only (F1, F2, F3: BodyWalk's gamepad is the gamepad whole, as always). Live.
direct_bodywalk_walk=1
; PROTOTYPE (docs/skill_wheel.md). 1 = a wheel in the headset (native OpenXR) of the controller's eight skill slots: the
; pad's B X Y RB and the same four with the left trigger held. Open it: hold the grip of the hand that does not point
; (the left one while laser_hand=1) and click the pointing hand's thumbstick. Point a wedge with the laser and pull the
; trigger: from then on the pointing hand's trigger casts that slot - the game's own pad button, nothing else; the centre
; is the basic attack again. EDIT SKILLS -> a slot -> a skill (or CLEAR SLOT) assigns a learned skill to the slot through
; the game's own setter. Names are the game's own text; icons come from a cache made out of YOUR installed game
; (tools/skill_icons/prepare_skill_icons.py, never shipped), without it the wheel shows names. 0 = nothing of it exists.
; skill_wheel_distance_m / skill_wheel_width_m: where the panel hangs in front of the head and how wide it is, in metres.
skill_wheel=0
skill_wheel_distance_m=0.8
skill_wheel_width_m=0.8
; (needs skill_wheel=1) how the skill panel opens. 1 = a LONG PRESS of the right thumbstick's click (about half a second, [direct]
; hold_ms; a short click is still the weapon swap; needs direct_input=1; the same long press closes it). 0 = the chord: the grip of
; the hand that does not point held + a click of the pointing hand's thumbstick. With 1 but BodyWalk's input (direct_input=0) the
; chord still works, since the long press cannot come then. Live. The panel works in VR first person (F4) only.
skill_wheel_open=1
; (needs skill_wheel=1) how the skill panel looks. 0 = the wheel above. 1 = TILES: a window made like the game's own controller skill
; dialog (drawn by the plugin, nothing of the game's art): two rows of six copper plates - A X B Y RB RT, and the same six with the
; left trigger held - red where a slot holds a skill, the pad button's mark under each; EDIT SKILLS shows every skill you have as a
; grid of plates. The same trigger cast and the same editor (the game's own setter); only the look. B X Y RB (and with LT) are cast
; by the trigger as before, A is the layout's attack as ever, LT + A is cast, RT and LT + RT are shown and editable but not cast. Live.
; With direct_input=1 (and [direct] not rebound) a tile also names the controller's own button that presses the slot.
; skill_wheel_distance_m is the tiles' distance too; skill_tiles_width_m is the tiles' window width in metres (its height follows).
skill_panel_style=0
skill_tiles_width_m=0.9
; docs/plan_laser_menus.md, step 2. 1 = in first person (F4) a menu or panel keeps the world in stereo
; around you and hangs the game's interface in front as a panel of its own (flat_width_m wide, at [screen]
; menu_distance_m); the laser points at it. 0 = the flat picture, as before. F1 - F3 always show the flat picture
menu_3d=1
; PROTOTYPE. 1 = a small settings panel in the headset, for native OpenXR without BodyWalk's menus: squeeze BOTH grips for a
; moment (a third of a second), then click a thumbstick (the same again closes it; B / Y or Menu close it too). From the moment
; both grips are squeezed the stick clicks are the panel's, not the game's (they swap weapons or show items there); a click
; right after the grips, or with one grip, is the game's as always. Point a controller at the panel and pull the trigger: the
; picture's distance and width, brightness, your height, the laser... Apply writes only what you changed into this file
; (the original is kept once as d2r_vr.ini.before-headset-menu; if the file was changed elsewhere meanwhile, the panel shows
; the new values instead of overwriting). Two more pages: Video - the VR render size ([render] vr_resolution_px / vr_resolution,
; the same keys as D2R VR Settings): presets from the window's own size to 4096 and the headset's own, a slider, the size the game
; draws now and what the headset recommends; Apply makes the game rebuild its picture (a few seconds frozen); Body - Calibrate body
; starts the T-pose measurement from inside the headset (the panel hides while its prompt runs and comes back with the numbers) and
; Forget measurement clears it ([calibration]). The first page's last row switches the game view, F1 - F4, like the F keys (the
; panel is F4's only: F1 - F3 close it; back to F4 by the F4 key, D2R VR Settings > Home, or a view action in BodyWalk's mapping).
; While it is open both controllers are the panel's: nothing of them reaches the
; game, and nothing the panel does sends a click or a key to the game. 0 = no panel, no chord, no cost.
; WITH THE SKILL PANEL IN THE TILES' LOOK ([openxr] skill_wheel=1, skill_panel_style=1) these pages are not a panel of their own but the
; SETTINGS TAB of the skill panel's window (tabs SKILLS | SETTINGS in its title plate): the long press of the right stick click opens it on
; the tab it was last on (the tab is remembered while the game runs), both grips a third of a second and a thumbstick click open it on
; Settings (on Skills they switch to Settings, on Settings they close it). It is closed as the skill panel is: the long press again, B / Y /
; Menu, or the pages' Close button; Calibrate body closes it for the measurement and it comes back on the Body page. The window FLIPS like
; pages along SKILLS | SETTINGS: View | Options | Video | Body: flick a thumbstick left or right (one flick, one page; it stops at the ends),
; tap the left grip (back) or the right grip (on), or click the arrow at the window's edge; dots at its foot show where it stands. While it is
; up the window takes both thumbsticks (the hero neither walks nor turns), and after it closes until each is back in the middle. Without the
; tiles' look the pages stay the panel of their own, as described above.
; F4 ONLY (VR first person): in another view it is as if this were 0 (an open panel closes).
headset_settings=0
; PROTOTYPE. 1 = BodyWalk's gesture RUNES in the headset (native OpenXR, with BodyWalk running): a shape you draw in the air with a hand
; is shown like a spell rune - its picture hangs in the room in front of you and lights up as far as your hand has drawn it, the
; path of your hand is a glowing trail ending in a bright blob at the hand, and when the shape is complete the picture flashes and
; fades (the gesture's own binding fires the game action: that is set in BodyWalk, not here). BodyWalk recognises the shape and
; decides what to show and where; the plugin only draws it, in the stage space BodyWalk placed it in, up to 4 runes at once (a
; picture and a trail each, 8 layers at most). A rune BodyWalk stops sending while it still shows fades out in 0.2 s. Nothing is
; drawn when BodyWalk is not running or sends no rune. 0 = nothing of it is read or drawn. Live.
; F4 ONLY (VR first person): nothing in F1, F2, F3 or the flat modes.
runes_draw=0
; 1 = pulses in the controllers (native OpenXR only; the headset's runtime drives the motors): a blow of yours that lands,
; a belt potion taken or drunk, the laser's click on a menu, a pick-up or an opening. They only watch the game, never change it.
; 0 = silent, as before. haptics_scale: every pulse stronger or weaker (0.1 - 2, 1 = the usual)
; F4 ONLY (VR first person): no pulse in the other views.
haptics=0
haptics_scale=1

[direct]
; The layout of [openxr] direct_input=1 in the world (no panel open). In a menu the controllers are the game's own
; gamepad, control for control (A B X Y, sticks and their clicks, grips = bumpers, triggers, menu = Start) - not
; changeable. Both sticks are the gamepad's: left walks, right turns.
; One line is one control: <control> = <output>[, <output>[, <output>]]
;   controls: left_trigger left_grip left_x left_y left_stick left_menu
;             right_trigger right_grip right_a right_b right_stick right_menu   (stick = the stick's click)
;   with the same hand's grip held:  left_grip+left_menu = ...   (a chord; it replaces the plain line then)
;   outputs:  pad:A B X Y LB RB LT RT L3 R3 Start Back Up Down Left Right   (the game's own gamepad buttons)
;             action:attack interact inventory map swap view1 view2 view3 view4 view5 viewnext recenter
;                    (attack = pad A that never picks up; interact = pick up / open / talk onto a target only)
;             cmd:<number or name>   a key command of the game, held as long as the control is: cmd:0x25,
;                    cmd:Show items (Alt), cmd:Potion - belt 1  (the names of the game's controls)
;             none                   nothing
;             action:skillpanel      ask for the skill panel (the wheel / the tiles) to open or close - for a long press
; A line left out keeps its default (below, commented); "x = none" unbinds it.
;
; Long presses. A control with a "<control>_hold" line is hold-or-tap: let go before hold_ms it is a TAP - its plain
; line acts, as a short press of the button, when you let go; held to hold_ms the hold line acts ONCE at that moment
; and the tap is gone. A key command in the plain line (Alt) is the exception: it is held at once, as it always was,
; and let go when the hold fires. In a menu the same table of the game's own pad holds: a long press of the left stick
; click is the inventory button (it closes the inventory, the command is a toggle), the right click stays R3 at once.
; Not while a panel of ours (the skill wheel) is up, and not with a chord on the grip (that acts at once).
; hold_enabled=0: no long presses at all - every click acts the moment it is pressed.
hold_enabled=1
; ms to hold, 200 - 1500
hold_ms=500
; 1 = a quick click of the left stick shows / hides the map (the click held is still Alt, show items); 0 = Alt only, as before.
; Only while the left_stick line below is not rebound.
left_stick_map=1
;right_stick_hold = action:skillpanel
;left_stick_hold = action:inventory
;right_trigger = action:attack
;right_a = action:interact
;right_b = pad:B
;left_x = pad:X
;left_y = pad:Y
;left_trigger = pad:LT
;right_stick = action:swap
;left_stick = cmd:Show items (Alt), action:map
;left_menu = action:inventory
;right_menu = action:inventory
;left_grip+left_menu = action:map
;left_grip+left_stick = action:recenter
;right_grip+right_b = pad:RB

[fog]
; 1 = distance fog through ReShade (D2R_DepthFog.fx must be in reshade-shaders\Shaders); with the sky on it fades into the sky
enabled=1
; where it begins and where it is complete, world units (hero ~7.5 tall)
start=30
end=200
; 1 = linear, more = clearer middle distance
curve=0.6
; the fog over a 5x5 grid this many pixels apart (0 = per pixel): holes and specks in the depth melt away
blur=3
; 0 = no fog in caves and dungeons (every area not on [sky] outdoor); the open air keeps it
caves=1
; where it begins and where it is complete in caves and dungeons (missing = start / end above)
caves_start=100
caves_end=200
; how much the full fog covers in caves: 1 = all, less = the far end shows through
caves_strength=1
; each act's own fog colour, #RRGGBB (caves of that act too; the sky's low part sinks into it);
; empty = the sky's horizon colour, or dark without a sky
; caves, dungeons, crypts - every area not on [sky] outdoor; empty = that act's colour
color_caves=#000000
color_act1=#303334
color_act2=#625233
color_act3=#364549
color_act4=#5A2712
color_act5=#212934
color_snow=#7E8D99

[sky]
; 1 = a sky in the black void beyond the world, through the same ReShade shader as the fog;
; only in the open air (by the area's biome), hidden while a menu or side panel is open
enabled=1
; 1 = sky everywhere, caves and dungeons too (for testing)
always=0
; per act: brightness, the picture round the viewer (texture_) and the zenith picture (cap_);
; bare names are looked for in reshade-shaders\Textures, full paths work too;
; an empty texture_ = the shader draws that sky itself (tools/gen_sky.py paints new ones)
brightness_act1=1
texture_act1=D2R_Sky_ours/D2R_Sky_act1.png
cap_act1=D2R_Sky_ours/D2R_SkyCap_act1.png
brightness_act2=1
texture_act2=D2R_Sky_ours/D2R_Sky_act2.png
cap_act2=D2R_Sky_ours/D2R_SkyCap_act2.png
brightness_act3=1
texture_act3=D2R_Sky_ours/D2R_Sky_act3.png
cap_act3=D2R_Sky_ours/D2R_SkyCap_act3.png
brightness_act4=1
texture_act4=D2R_Sky_ours/D2R_Sky_act4.png
cap_act4=D2R_Sky_ours/D2R_SkyCap_act4.png
brightness_act5=1
texture_act5=D2R_Sky_ours/D2R_Sky_act5.png
cap_act5=D2R_Sky_ours/D2R_SkyCap_act5.png
brightness_snow=1
texture_snow=D2R_Sky_ours/D2R_Sky_snow.png
cap_snow=D2R_Sky_ours/D2R_SkyCap_snow.png
; times each biome's own cloud cover; 0 = clear
clouds=1
; 0 = keep the sky while a side panel (inventory, skills...) shifts the picture
hide_with_panels=1
; biomes that get a sky, comma separated; the log names every biome the game sets
; ("vrcam: biome '...'"), add one here if its area should have a sky
outdoor=act1_outdoors,act1_tristram,act1_court,act2_outdoors,act2_town,act3_jungle,act3_docktown,act3_kurast,act3_travincal_outdoors,act4_mesa,act4_lava,act4_diab,expansion_town,expansion_siege,expansion_mountaintop,expansion_ruins,expansion_ruins_snow,expansion_wildtemple_tempenter
light_day=128
light_night=65

[ceiling]
; 1 = a stone vault over the black void in caves, through the same ReShade shader as the sky;
; first person only (VR F4, flat F3), never from above, from behind or on the floor
enabled=1
; how high over the hero's floor, world units (hero ~7.5 tall); under the walls' tops they pierce it
height=18
; world units per tile of the picture (the test grid's cell)
scale=10
brightness=1
; world units from the hero where his light on the ceiling is down to half; farther it goes dark
light_radius=25
; 1 = the game's own torches and braziers light the ceiling over them;
; its glow, and world units from the fire where its light is down to half
; off for now: finding the torches read all the game's memory every 1.5 s (VR dropouts on weak PCs, 0.142)
torches=0
; 1 = any fire seen in the picture lights the ceiling instead (torches, braziers, fire spells, burning
; monsters), found by ReShade - no reading of the game's memory; torch_brightness and torch_radius apply
fire_from_picture=0
torch_brightness=1.8
torch_radius=10
; fire_from_picture: world units a fire is put nearer to the eye than the wall or floor behind it (a flame has no
