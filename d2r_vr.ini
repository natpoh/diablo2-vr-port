; aim_distance_by_arm: 1 = VR first person (F4), the arms on the controllers, SPELLS only (a wand, an orb, a staff held in one hand, bare hands): how far out the spell's
;     aim point is follows how far the aiming arm is stretched along the aim - the arm at the body gives aim_near_cells, the arm stretched out gives the weapon's own
;     distance (caster_range, hand_range, staff_range_one, as above). As in flat D2, where a Shift + click near the hero spreads Teeth wide and one far away keeps it in a tight
;     cone. The stretch is measured on your own arm: the shoulder of the drawn hero and the length from it to the grip (his arm bones are fitted to the T-pose span of
;     [calibration], else to your height); the part of that length the hand has gone out from the shoulder along the way the hand points, smoothed a little so the point does
;     not jitter. A staff with one hand on it follows the arm too, up to staff_range_two; a staff held in BOTH hands always aims at staff_range_two, whatever the arm
;     does. A bow, a crossbow and throws keep their fixed distance (range, xbow_range_*). It only chooses the point the game's own spell is aimed at, as a click would. [debug] spell_aim_ray ends where the point is. 0 = the distances above, as they were. Live.
aim_distance_by_arm=0
; aim_near_cells: a spell's aim point with the arm at the body, cells (3..20; the weapon's own distance above it is the far end). Live.
aim_near_cells=3
