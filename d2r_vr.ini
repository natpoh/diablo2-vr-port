[debug]
; how the replayed lists are submitted (stereo from one pass). Live.
;   1 = one ExecuteCommandLists a list and a signal after each (and around the right eye's effects): a hang's log names the list; ~35 submissions a pair (~0.4 ms of the
;       game's thread). The setting since 2026-10-09 ("no hangs since") and again from test-63
;   0 = each queue's run of lists in ONE ExecuteCommandLists, no signals (test-60 .. test-62): the graphics queue ran a list that never ended, 30 s to 3 min in
;       (2026-10-18, bow drawn); no hang with 1 or with replay_right=0
;   2 = one ExecuteCommandLists a list, no signals: for a test - the cost of 0 without its hang, if the hang needs the batch and not the missing signals
;   3 = the game's own calls: the same lists in the same ExecuteCommandLists calls as the game made them (a hook on the queues sees the calls), no signals of ours but the
;       queue switches' - the game's number of submissions and no more. Needs a game restart the first time (the hook goes in at the first pair). For a test
;   4 = the same with a signal after each call
replay_marks=3
